<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c9363a">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ลงทะเบียน · INTANIA MUSIC FEST</title>
<link rel="icon" href="assets/icon.png">
<link rel="stylesheet" href="assets/style.css?v=66">
<script src="assets/config.js"></script>
<script src="assets/vendor/supabase.js"></script>
<script src="assets/app.js?v=66"></script>
</head>
<body>
<main class="stage"><div class="inner" id="root"><div class="spinner" style="margin-top:120px"></div></div></main>

<script>
(async () => {
  const { api, rpc, $, $$, esc, fmt, EVENT, GROUPS, CATEGORY, YEAR, GENDER } = IMF;
  const root = $('#root');

  // remember a friend's code from the invite link (survives the Google sign-in redirect)
  const qs = new URLSearchParams(location.search);
  // where to go after signing in / registering (only pages of this site)
  // where to go after signing in / registering (set by the page that sent us here; survives the Google redirect)
  if (/^[a-z]+\.html$/.test(qs.get('next') || '')) sessionStorage.setItem('imf_next', qs.get('next'));
  const next = sessionStorage.getItem('imf_next') || 'index.html';
  if (qs.get('ref')) localStorage.setItem('imf_ref', qs.get('ref').toUpperCase().slice(0, 12));

  const { info, settings } = await IMF.boot();
  const savedRef = settings.referral_open ? (localStorage.getItem('imf_ref') || '') : '';
  const engOnly = settings.eng_round_open && !settings.general_round_open;
  const closed = !settings.eng_round_open && !settings.general_round_open;

  if (info.logged_in && info.registered) { sessionStorage.removeItem('imf_next'); location.replace(next); return; }

  // ---------- step 1: sign in ----------
  // eng round: CU student accounts only · general round: Chula only (Google/Gmail only when "บุคคลภายนอก" is on)
  const allowGoogle = closed || (settings.general_round_open && settings.allow_external);
  if (!info.logged_in) {
    root.innerHTML = `<div class="soon">
      <img class="soon-logo" src="${IMF.LOGO}" alt="INTANIA MUSIC FEST">
      <h2>${closed ? 'เข้าสู่ระบบ' : 'ลงทะเบียน'}</h2>
      ${closed ? '<div class="muted center">ยังไม่เปิดลงทะเบียน · ลงทะเบียนไว้แล้วเข้าสู่ระบบได้เลย</div>'
        : `<div class="muted center">${engOnly ? 'รอบนิสิตคณะวิศวกรรมศาสตร์' : allowGoogle ? 'นิสิตและบุคลากรจุฬาฯ ใช้บัญชี CU · บุคคลภายนอกใช้ Google' : 'เฉพาะนิสิตและบุคลากรจุฬาฯ'}</div>`}
      ${savedRef ? `<span class="chip on">โค้ดเพื่อน ${esc(savedRef)}</span>` : ''}
      <div id="login" class="stack" style="width:100%"></div>
    </div>`;
    IMF.loginButtons($('#login'), { cuOnly: !allowGoogle, cuHd: engOnly ? 'student.chula.ac.th' : null });
    return;
  }

  // ---------- signed in, but this round isn't for them ----------
  const cat = info.category;
  let blocked = null;
  if (closed) blocked = 'ตอนนี้ยังไม่เปิดลงทะเบียน';
  else if (engOnly && cat !== 'eng') blocked = cat === 'external'
    ? 'รอบนี้ต้องใช้อีเมลจุฬาฯ (@student.chula.ac.th) ของนิสิตวิศวะ ลองเปลี่ยนบัญชีแล้วเข้าสู่ระบบใหม่'
    : 'รอบนี้เปิดเฉพาะนิสิตวิศวะก่อน รอบสำหรับประชาคมจุฬาฯ จะเปิดเร็ว ๆ นี้';
  else if (cat === 'external' && !settings.allow_external) blocked = 'ตอนนี้เปิดเฉพาะนิสิตและบุคลากรจุฬาฯ (อีเมล @chula.ac.th หรือ @student.chula.ac.th) รอบบุคคลภายนอกจะเปิดทีหลัง';
  if (blocked) {
    root.innerHTML = `<div class="soon"><img class="soon-logo" src="${IMF.LOGO}" alt="INTANIA MUSIC FEST"><h2>ยังลงทะเบียนไม่ได้</h2>
      <div class="card" style="width:100%">${esc(blocked)}<div class="hint">เข้าสู่ระบบอยู่ด้วย ${esc(info.email)}</div></div>
      <button class="btn ghost block" id="switch">เปลี่ยนบัญชี</button></div>`;
    $('#switch').onclick = async () => { await api.signOut(); location.reload(); };
    return;
  }

  // ---------- step 2: the form ----------
  const who = info.student_id
    ? [info.student_id, info.faculty ? 'คณะ' + info.faculty : '', info.year ? YEAR[info.year] : ''].filter(Boolean).join(' · ')
    : CATEGORY[cat];
  root.innerHTML = `<form id="f" class="stack" novalidate>
    <h1 class="page-title">กรอกข้อมูล</h1>
    <div class="card small" style="padding:12px 14px">
      <div class="row" style="justify-content:space-between"><b>${esc(who)}</b><a href="#" id="switch" class="dim">เปลี่ยนบัญชี</a></div>
      <div class="dim">${esc(info.email)}</div>
    </div>
    <div class="grid-2">
      <label class="f"><span>ชื่อ</span><input class="input" name="first_name" autocomplete="given-name"></label>
      <label class="f"><span>นามสกุล</span><input class="input" name="last_name" autocomplete="family-name"></label>
    </div>
    <div class="grid-2">
      <label class="f"><span>ชื่อเล่น</span><input class="input" name="nickname" autocomplete="nickname"></label>
      <label class="f"><span>เบอร์โทร</span><input class="input" name="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="08x-xxx-xxxx"></label>
    </div>
    <div class="f"><span>เพศ</span><div class="seg" id="gender">${Object.keys(GENDER).map(k => `<button type="button" data-v="${k}">${GENDER[k]}</button>`).join('')}</div></div>
    ${cat === 'eng' ? `<div class="f"><span>กรุ๊ป</span><div class="seg groups" id="group">${GROUPS.map(g => `<button type="button" data-v="${g}">${g}</button>`).join('')}</div></div>` : ''}
    ${settings.referral_open ? `<label class="f"><span>โค้ดเพื่อน <i>(ถ้ามี)</i></span><input class="input" name="ref_code" maxlength="12" autocapitalize="characters" style="text-transform:uppercase;letter-spacing:3px" value="${esc(savedRef)}" placeholder="XXXXXX"></label>` : ''}
    <label class="check"><input type="checkbox" name="consent">
      <span>ยินยอมให้ทีมงาน INTANIA MUSIC FEST เก็บและใช้ข้อมูลนี้เพื่อการลงทะเบียน การติดต่อ และการจัดงานครั้งนี้เท่านั้น</span></label>
    <div id="err" class="errtext"></div>
    <button class="btn big block" id="submit"><b>ลงทะเบียน</b></button>
  </form>`;

  $('#switch').onclick = async (e) => { e.preventDefault(); await api.signOut(); location.reload(); };
  $$('.seg').forEach(box => box.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    $$('button', box).forEach(x => x.classList.toggle('on', x === b)); box.dataset.value = b.dataset.v; box.classList.remove('err');
  }));

  $('#f').onsubmit = async (e) => {
    e.preventDefault();
    const f = e.target, btn = $('#submit'), err = $('#err');
    $$('.err', f).forEach(i => i.classList.remove('err'));
    err.textContent = '';
    const p = {
      first_name: f.first_name.value.trim(), last_name: f.last_name.value.trim(), nickname: f.nickname.value.trim(),
      phone: f.phone.value, gender: $('#gender').dataset.value || null,
      group_code: $('#group') ? ($('#group').dataset.value || null) : null,
      ref_code: f.ref_code ? f.ref_code.value.trim().toUpperCase() : '', consent: f.consent.checked
    };
    const bad = (el, msg) => { if (el) el.classList.add('err'); err.textContent = msg; (el || btn).scrollIntoView({ block: 'center', behavior: 'smooth' }); };
    if (!p.first_name) return bad(f.first_name, 'กรุณากรอกชื่อ');
    if (!p.last_name) return bad(f.last_name, 'กรุณากรอกนามสกุล');
    if (!p.nickname) return bad(f.nickname, IMF.errMsg('BAD_NICKNAME'));
    if (!/^0\d{8,9}$/.test(p.phone.replace(/\D/g, ''))) return bad(f.phone, IMF.errMsg('BAD_PHONE'));
    if (!p.gender) return bad($('#gender'), IMF.errMsg('BAD_GENDER'));
    if ($('#group') && !p.group_code) return bad($('#group'), IMF.errMsg('BAD_GROUP'));
    if (!p.consent) return bad(null, IMF.errMsg('NO_CONSENT'));

    btn.disabled = true; btn.textContent = 'กำลังบันทึก…';
    try {
      await rpc('register', { p });
      localStorage.removeItem('imf_ref');
      success(p.nickname);
    } catch (ex) {
      const raw = String(ex.message || '');
      bad(/BAD_REF/.test(raw) ? f.ref_code : null, IMF.errMsg(ex));
      if (/ALREADY_REGISTERED/.test(raw)) setTimeout(() => location.replace(next), 1200);
      btn.disabled = false; btn.innerHTML = '<b>ลงทะเบียน</b>';
    }
  };

  async function success(name) {
    sessionStorage.removeItem('imf_next');
    window.scrollTo(0, 0);
    const me = settings.referral_open ? await api.myProfile().catch(() => null) : null;
    root.innerHTML = `<div class="stack">
      <h1 class="page-title">ลงทะเบียนสำเร็จ 🎉</h1>
      <p class="muted center" style="margin:0">เจอกันนะ ${esc(name)}<br>28 มกราคม 2570 ที่ลานอินทาเนีย</p>
      ${me && me.points ? `<div class="center"><span class="chip on">ได้รับ ${fmt(me.points)} Point</span></div>` : ''}
      ${me ? IMF.inviteCard(me, 0) : ''}
      <a class="btn red big block" href="${next}">${next === 'me.html' ? 'ไปที่บัตรเข้างาน' : 'ไปหน้าแรก'}</a>
    </div>`;
  }
})();
</script>
</body>
</html>
