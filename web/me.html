<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>บัตร & แต้มของฉัน · INTANIA MUSIC FEST 2027</title>
<link rel="icon" href="assets/logo.jpg">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/config.js"></script>
<script src="assets/vendor/supabase.js"></script>
<script src="assets/vendor/qrcode.js"></script>
<script src="assets/app.js"></script>
</head>
<body>
<main>
  <div class="wrap narrow" id="root"><div class="spinner"></div></div>
</main>

<script>
(async () => {
  const { api, rpc, $, esc, fmt, CATEGORY, YEAR } = IMF;
  IMF.header(); IMF.footer();
  const root = $('#root');

  const session = await api.session();
  if (!session) {
    root.innerHTML = `<div class="stack center"><h1>บัตร & แต้ม<br>ของฉัน</h1>
      <p class="muted">เข้าสู่ระบบด้วยบัญชีที่ใช้ลงทะเบียน</p>
      <button class="btn big block" id="login">เข้าสู่ระบบด้วย Google</button>
      <a class="small dim" href="register.html">ยังไม่ได้ลงทะเบียน? ลงทะเบียนที่นี่</a></div>`;
    $('#login').onclick = () => api.signIn().catch(e => IMF.toast(IMF.errMsg(e), true));
    return;
  }

  let me, settings, history;
  try {
    [me, settings] = await Promise.all([api.myProfile(), api.settings()]);
    if (!me) { location.replace('register.html'); return; }
    history = await rpc('my_points_history');
  } catch (e) { root.innerHTML = `<div class="card">${esc(IMF.errMsg(e))}</div>`; return; }

  const showQR = settings.ticket_open || settings.redeem_open;
  const sub = [CATEGORY[me.category], me.group_code ? 'กรุ๊ป ' + me.group_code : '', me.year ? YEAR[me.year] : ''].filter(Boolean).join(' · ');
  const reasonTxt = { referral: 'เพื่อนลงทะเบียน', signup_bonus: 'โบนัสใช้รหัสเพื่อน', redeem: 'แลกของ', adjust: 'ปรับแต้มโดยทีมงาน' };

  root.innerHTML = `<div class="stack">
    <div class="ticket">
      <div class="t-top">
        <div class="t-meta"><span>INTANIA MUSIC FEST</span><span>No. 2027</span></div>
        <h2 style="margin-top:16px" class="th">${esc(me.first_name)} ${esc(me.last_name)}${me.nickname ? ` <span class="dim">(${esc(me.nickname)})</span>` : ''}</h2>
        <div class="muted small" style="margin-top:6px">${esc(sub)}</div>
      </div>
      <div class="cut"><i></i><b></b></div>
      <div style="padding:10px 24px 24px">
        ${showQR ? `<div class="qr" id="qr"></div>
          <div class="center small muted" style="margin-top:12px">${me.checked_in_at ? '✅ รับบัตรแล้ว ' + IMF.dateTH(me.checked_in_at) : 'แสดง QR นี้ที่จุดรับบัตรและจุดแลกของรางวัล'}</div>
          <div class="center small dim">เพิ่มความสว่างหน้าจอเพื่อให้สแกนง่ายขึ้น</div>`
        : `<div class="center" style="padding:24px 0"><div style="font-size:40px">🎟️</div>
            <b>ลงทะเบียนเรียบร้อย</b><div class="muted small">QR สำหรับรับบัตรเข้างานจะเปิดให้ดูกลางเดือนมกราคม</div></div>`}
        <div class="t-mid" style="padding:16px 0 0">
          <div><div class="kicker">DATE / THURSDAY</div><div class="t-date" style="font-size:40px">28 JAN 2027</div></div>
          <div class="t-time" style="font-size:22px">17:00 – 22:00</div>
        </div>
      </div>
    </div>

    <div class="card white stack">
      <div class="row" style="justify-content:space-between;align-items:flex-end">
        <div><div class="kicker" style="color:#555">แต้มของฉัน</div><div class="points-big">${fmt(me.points)}</div></div>
        <a href="leaderboard.html#referrers" class="small" style="color:#555">ดูอันดับแต้ม →</a>
      </div>
      <div class="kicker" style="color:#555">รหัสชวนเพื่อน</div>
      <div class="code-box" style="border-color:#000"><b>${esc(me.ref_code)}</b><button class="btn small" id="cp" style="background:#000;color:#fff;border-color:#000">คัดลอก</button></div>
      <div class="grid-2">
        <button class="btn block" id="share" style="background:#000;color:#fff;border-color:#000">ส่งลิงก์ชวนเพื่อน</button>
        <button class="btn block" id="cplink" style="background:#fff;color:#000;border-color:#000">คัดลอกลิงก์</button>
      </div>
      <div class="small" style="color:#555">${settings.referral_open
        ? `เพื่อนลงทะเบียนด้วยรหัสนี้ 1 คน = ${fmt(settings.points_per_referral)} แต้ม${+settings.points_signup_bonus > 0 ? ` (เพื่อนได้ ${fmt(settings.points_signup_bonus)} แต้มด้วย)` : ''} · เอาแต้มไปแลกของในวันงาน`
        : 'ตอนนี้ปิดการสะสมแต้มจากการชวนเพื่อนแล้ว'}</div>
    </div>

    <div class="card">
      <div class="card-title"><h3>ประวัติแต้ม</h3></div>
      ${history.length ? `<ul class="list">${history.map(h => `<li>
          <div style="flex:1"><b>${esc(reasonTxt[h.reason] || h.reason)}</b>${h.detail ? ` <span class="muted">· ${esc(h.detail)}</span>` : ''}
          <div class="small dim">${IMF.dateTH(h.created_at)}</div></div>
          <div class="mono" style="color:${h.delta > 0 ? 'var(--ok)' : 'var(--bad)'}">${h.delta > 0 ? '+' : ''}${h.delta}</div></li>`).join('')}</ul>`
        : '<div class="dim">ยังไม่มีแต้ม ส่งรหัสให้เพื่อนเลย!</div>'}
    </div>

    <details class="card">
      <summary style="cursor:pointer;font-weight:700">แก้ไขข้อมูลติดต่อ</summary>
      <form id="edit" class="stack" style="margin-top:16px">
        <label class="f"><span>ชื่อเล่น</span><input class="input" name="nickname" value="${esc(me.nickname || '')}"></label>
        <label class="f"><span>เบอร์โทร</span><input class="input" name="phone" type="tel" inputmode="numeric" value="${esc(me.phone)}"></label>
        <label class="f"><span>แพ้อาหาร</span><input class="input" name="food_allergy" value="${esc(me.food_allergy || '')}"></label>
        <div class="hint">ต้องการแก้ชื่อ กรุ๊ป หรือชั้นปี ติดต่อทีมงานทาง IG</div>
        <button class="btn">บันทึก</button>
      </form>
    </details>

    <div class="center"><a href="#" id="logout" class="small dim">ออกจากระบบ (${esc(me.email)})</a></div>
  </div>`;

  if (showQR) $('#qr').innerHTML = IMF.qrSvg('IMF27:' + me.qr_token);
  $('#cp').onclick = () => IMF.copy(me.ref_code);
  $('#cplink').onclick = () => IMF.copy(IMF.inviteUrl(me.ref_code));
  $('#share').onclick = () => IMF.shareInvite(me.ref_code);
  $('#logout').onclick = async (e) => { e.preventDefault(); await api.signOut(); location.href = 'index.html'; };
  $('#edit').onsubmit = async (e) => {
    e.preventDefault();
    const f = e.target;
    try {
      await rpc('update_my_profile', { p: { nickname: f.nickname.value, phone: f.phone.value, food_allergy: f.food_allergy.value } });
      IMF.toast('บันทึกแล้ว');
    } catch (ex) { IMF.toast(IMF.errMsg(ex), true); }
  };
})();
</script>
</body>
</html>
