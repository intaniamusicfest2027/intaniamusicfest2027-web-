<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สแกน · INTANIA MUSIC FEST 2027</title>
<link rel="icon" href="assets/logo.jpg">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/config.js"></script>
<script src="assets/vendor/supabase.js"></script>
<script src="assets/vendor/html5-qrcode.min.js"></script>
<script src="assets/app.js"></script>
</head>
<body>
<main>
  <div class="wrap narrow" id="root"><div class="spinner"></div></div>
</main>

<script>
(async () => {
  const { api, rpc, $, $$, esc, fmt, CATEGORY, YEAR } = IMF;
  IMF.header(); IMF.footer();
  const root = $('#root');

  const info = await rpc('my_email_info').catch(() => ({}));
  if (!info.logged_in) {
    root.innerHTML = `<div class="stack center"><h1>ทีมงาน</h1><button class="btn big block" id="login">เข้าสู่ระบบด้วย Google</button></div>`;
    $('#login').onclick = () => api.signIn(); return;
  }
  if (!info.is_staff) {
    root.innerHTML = `<div class="card">บัญชี <span class="mono">${esc(info.email)}</span> ยังไม่ได้รับสิทธิ์ทีมงาน ให้แอดมินเพิ่มสิทธิ์ในหน้าหลังบ้าน</div>`; return;
  }

  let settings = await api.settings();
  let rewards = await api.rewards();
  let mode = 'checkin', current = null, busy = false, scanner = null, lastText = '', lastAt = 0;

  root.innerHTML = `<div class="stack">
    <div class="row" style="justify-content:space-between"><h1>สแกน</h1><span class="chip mono">${esc(info.email)}</span></div>
    <div class="seg" id="mode">
      <button type="button" data-v="checkin" class="on">🎟️ รับบัตรเข้างาน</button>
      <button type="button" data-v="redeem">🎁 แลกแต้ม</button>
    </div>
    <div id="reader"></div>
    <div class="row">
      <button class="btn block" id="cam" style="flex:1">เปิดกล้อง</button>
    </div>
    <form id="manual" class="row" autocomplete="off">
      <input class="input" name="q" placeholder="หรือพิมพ์ รหัสเพื่อน / รหัสนิสิต / อีเมล" style="flex:1">
      <button class="btn small">ค้นหา</button>
    </form>
    <div id="result"></div>
    <div class="card"><div class="card-title"><h3>ล่าสุด</h3><span class="small dim" id="count">0</span></div><ul class="list small" id="log"></ul></div>
  </div>`;

  const log = [];
  function addLog(t) { log.unshift(t); $('#log').innerHTML = log.slice(0, 15).map(x => `<li>${x}</li>`).join(''); $('#count').textContent = log.length + ' รายการ'; }
  function beep(ok) {
    try { const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(); o.frequency.value = ok ? 880 : 220; o.connect(c.destination); o.start(); setTimeout(() => { o.stop(); c.close(); }, ok ? 120 : 350); } catch (e) {}
    if (navigator.vibrate) navigator.vibrate(ok ? 60 : [80, 60, 80]);
  }

  $('#mode').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    $$('#mode button').forEach(x => x.classList.toggle('on', x === b));
    mode = b.dataset.v; $('#result').innerHTML = ''; current = null;
    if (mode === 'redeem' && !settings.redeem_open) IMF.toast('ยังไม่เปิดระบบแลกแต้ม (เปิดได้ที่หลังบ้าน → ตั้งค่า)', true);
  });

  function personHTML(p) {
    return `<div class="th" style="font-size:24px">${esc(p.name)}${p.nickname ? ` <span class="dim">(${esc(p.nickname)})</span>` : ''}</div>
      <div class="muted small">${esc(CATEGORY[p.category])}${p.group_code ? ' · กรุ๊ป ' + esc(p.group_code) : ''}${p.year ? ' · ' + esc(YEAR[p.year]) : ''}${p.student_id ? ' · ' + esc(p.student_id) : ''}</div>
      ${p.food_allergy ? `<div class="chip warn" style="margin-top:8px">แพ้อาหาร: ${esc(p.food_allergy)}</div>` : ''}
      ${!p.by_token ? `<div class="chip warn" style="margin-top:8px">ค้นหาด้วยการพิมพ์ ตรวจบัตรนิสิต/บัตรประชาชนก่อน</div>` : ''}`;
  }

  async function handle(text) {
    if (busy) return;
    busy = true;
    $('#result').innerHTML = '<div class="spinner"></div>';
    try {
      const p = await rpc('staff_lookup', { q: text });
      current = p;
      if (mode === 'checkin') {
        const r = await rpc('staff_checkin', { uid: p.id });
        beep(r.ok);
        $('#result').innerHTML = `<div class="result ${r.ok ? 'ok' : 'warn'} stack">
          <div style="font-size:30px;font-weight:700;color:${r.ok ? 'var(--ok)' : 'var(--warn)'}">${r.ok ? '✅ ให้บัตรได้' : '⚠️ รับบัตรไปแล้ว'}</div>
          ${r.ok ? '' : `<div class="small">รับไปเมื่อ ${IMF.dateTH(r.checked_in_at)}</div>`}
          ${personHTML(p)}</div>`;
        addLog(`${r.ok ? '✅' : '⚠️'} ${esc(p.name)} <span class="dim">${new Date().toLocaleTimeString('th-TH')}</span>`);
      } else {
        beep(true);
        renderRedeem(p);
      }
    } catch (e) {
      beep(false);
      $('#result').innerHTML = `<div class="result bad"><div style="font-size:26px;font-weight:700;color:var(--bad)">❌ ${esc(IMF.errMsg(e))}</div></div>`;
    } finally { busy = false; }
  }

  function renderRedeem(p) {
    $('#result').innerHTML = `<div class="result stack">
      ${personHTML(p)}
      <div class="row" style="justify-content:space-between"><span class="muted">แต้มคงเหลือ</span><span class="points-big" style="font-size:64px">${fmt(p.points)}</span></div>
      <div class="stack" id="rw">${rewards.map(r => {
        const can = p.points >= r.cost && (r.stock == null || r.stock > 0);
        return `<button class="btn block ${can ? '' : 'ghost'}" data-id="${r.id}" ${can ? '' : 'disabled'} style="justify-content:space-between">
          <span>${esc(r.name)}${r.stock != null ? ` <small class="dim">(เหลือ ${fmt(r.stock)})</small>` : ''}</span><span class="mono">${fmt(r.cost)} แต้ม</span></button>`;
      }).join('') || '<div class="dim">ยังไม่มีของรางวัล เพิ่มได้ที่หลังบ้าน</div>'}</div></div>`;
    $('#rw').onclick = async e => {
      const b = e.target.closest('button[data-id]'); if (!b) return;
      const rw = rewards.find(r => r.id == b.dataset.id);
      if (!confirm(`แลก "${rw.name}" ใช้ ${rw.cost} แต้ม?`)) return;
      b.disabled = true;
      try {
        const r = await rpc('staff_redeem', { uid: p.id, reward: rw.id });
        beep(true); IMF.toast(`แลก ${r.reward} สำเร็จ`);
        addLog(`🎁 ${esc(p.name)} · ${esc(r.reward)} <span class="dim">${new Date().toLocaleTimeString('th-TH')}</span>`);
        rewards = await api.rewards();
        p.points = r.points; renderRedeem(p);
      } catch (ex) { beep(false); IMF.toast(IMF.errMsg(ex), true); b.disabled = false; }
    };
  }

  $('#manual').onsubmit = e => { e.preventDefault(); const v = e.target.q.value.trim(); if (v) handle(v); };

  $('#cam').onclick = async () => {
    if (scanner) { await scanner.stop().catch(() => {}); scanner.clear(); scanner = null; $('#cam').textContent = 'เปิดกล้อง'; return; }
    scanner = new Html5Qrcode('reader');
    try {
      await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: (w, h) => { const s = Math.floor(Math.min(w, h) * 0.7); return { width: s, height: s }; } },
        text => {
          const now = Date.now();
          if (text === lastText && now - lastAt < 4000) return;   // ignore the same code for 4 s
          lastText = text; lastAt = now; handle(text);
        });
      $('#cam').textContent = 'ปิดกล้อง';
    } catch (e) {
      scanner = null; IMF.toast('เปิดกล้องไม่ได้: ' + (e.message || e), true);
    }
  };
})();
</script>
</body>
</html>
