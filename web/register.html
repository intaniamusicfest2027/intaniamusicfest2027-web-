<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ลงทะเบียน · INTANIA MUSIC FEST 2027</title>
<link rel="icon" href="assets/logo.jpg">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/config.js"></script>
<script src="assets/vendor/supabase.js"></script>
<script src="assets/app.js"></script>
</head>
<body>
<main>
  <div class="wrap narrow" id="root"><div class="spinner"></div></div>
</main>

<script>
(async () => {
  const { api, rpc, $, $$, esc, CFG, GROUPS, CATEGORY } = IMF;
  IMF.header(); IMF.footer();
  const root = $('#root');

  // remember a friend's code from the invite link (survives the Google login redirect)
  const qs = new URLSearchParams(location.search);
  if (qs.get('ref')) localStorage.setItem('imf_ref', qs.get('ref').toUpperCase());
  const savedRef = localStorage.getItem('imf_ref') || '';

  const FACULTIES = ['คณะครุศาสตร์','คณะจิตวิทยา','คณะทันตแพทยศาสตร์','คณะนิติศาสตร์','คณะนิเทศศาสตร์','คณะพยาบาลศาสตร์',
    'คณะพาณิชยศาสตร์และการบัญชี','คณะแพทยศาสตร์','คณะเภสัชศาสตร์','คณะรัฐศาสตร์','คณะวิทยาศาสตร์','คณะวิทยาศาสตร์การกีฬา',
    'คณะวิศวกรรมศาสตร์','คณะเศรษฐศาสตร์','คณะศิลปกรรมศาสตร์','คณะสถาปัตยกรรมศาสตร์','คณะสหเวชศาสตร์','คณะสัตวแพทยศาสตร์',
    'คณะอักษรศาสตร์','สำนักวิชาทรัพยากรการเกษตร','บัณฑิตวิทยาลัย','สถาบัน/วิทยาลัยอื่น ๆ'];

  let settings, info;
  try {
    [settings, info] = await Promise.all([api.settings(), rpc('my_email_info')]);
  } catch (e) {
    root.innerHTML = `<div class="card">${esc(IMF.errMsg(e))}</div>`; return;
  }

  const engOnly = settings.eng_round_open && !settings.general_round_open;
  const closed = !settings.eng_round_open && !settings.general_round_open;

  if (info.logged_in && info.registered) { location.replace('me.html'); return; }

  // ---------- step 1: sign in ----------
  if (!info.logged_in) {
    root.innerHTML = `<div class="stack">
      <div class="kicker">${engOnly ? esc(CFG.ENG_ROUND_NOTE) : 'ลงทะเบียนเข้างาน'}</div>
      <h1>ลงทะเบียน</h1>
      ${closed ? `<div class="card">ตอนนี้ยังไม่เปิดลงทะเบียน ติดตามประกาศได้ที่ IG @${esc(CFG.CONTACT_IG)}</div>` : `
      <p class="muted">${engOnly
        ? 'รอบนี้สำหรับ<b style="color:#fff">นิสิตวิศวะ ปี 1–4</b> เข้าสู่ระบบด้วยอีเมลจุฬาฯ (<span class="mono">รหัสนิสิต@student.chula.ac.th</span>) แล้วกรอกข้อมูลอีกไม่กี่ช่องก็เสร็จ'
        : 'เข้าสู่ระบบด้วยบัญชี Google แล้วกรอกข้อมูลอีกไม่กี่ช่องก็เสร็จ นิสิตและบุคลากรจุฬาฯ ให้ใช้อีเมลจุฬาฯ'}</p>
      ${savedRef ? `<div class="chip on">รหัสเพื่อน: ${esc(savedRef)}</div>` : ''}
      <button class="btn big block" id="login">
        <svg class="g" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.2 0-11.5-4.1-13.4-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>
        เข้าสู่ระบบด้วย Google
      </button>
      <div class="hint center">ใช้ข้อมูลจากบัญชีเพื่อยืนยันตัวตนเท่านั้น</div>`}
    </div>`;
    const b = $('#login');
    if (b) b.onclick = async () => {
      b.disabled = true;
      try { await api.signIn({ hd: engOnly ? 'student.chula.ac.th' : undefined }); }
      catch (e) { IMF.toast(IMF.errMsg(e), true); b.disabled = false; }
    };
    return;
  }

  // ---------- logged in but this round isn't for them ----------
  const cat = info.category;
  let blocked = null;
  if (closed) blocked = 'ตอนนี้ยังไม่เปิดลงทะเบียน';
  else if (engOnly && cat !== 'eng') blocked = cat === 'chula_student' || cat === 'chula_staff'
    ? 'รอบนี้เปิดเฉพาะนิสิตวิศวะก่อน รอบทั่วไปสำหรับประชาคมจุฬาฯ จะเปิดเร็ว ๆ นี้'
    : 'รอบนี้ต้องใช้อีเมลจุฬาฯ (@student.chula.ac.th) ของนิสิตวิศวะ ลองเปลี่ยนบัญชีแล้วเข้าสู่ระบบใหม่';
  else if (cat === 'external' && !settings.allow_external) blocked = 'รอบนี้เปิดเฉพาะนิสิตและบุคลากรจุฬาฯ กรุณาใช้อีเมลจุฬาฯ';

  if (blocked) {
    root.innerHTML = `<div class="stack">
      <h1>ยังลงทะเบียน<br>ไม่ได้</h1>
      <div class="card">${esc(blocked)}<div class="hint">เข้าสู่ระบบอยู่ด้วย <span class="mono">${esc(info.email)}</span></div></div>
      <button class="btn ghost block" id="switch">เปลี่ยนบัญชี</button></div>`;
    $('#switch').onclick = async () => { await api.signOut(); location.reload(); };
    return;
  }

  // ---------- step 2: the form ----------
  const isStudent = cat === 'eng' || cat === 'chula_student';
  const yearBtns = ['1','2','3','4','5+','grad'].filter(y => cat === 'eng' && engOnly ? ['1','2','3','4'].includes(y) : true);

  root.innerHTML = `<form id="f" class="stack" novalidate>
    <div class="kicker">ขั้นตอนสุดท้าย</div>
    <h1>กรอกข้อมูล</h1>
    <div class="row">
      <span class="chip on">${esc(CATEGORY[cat])}</span>
      <span class="chip mono">${esc(info.email)}</span>
      <a href="#" id="switch" class="small dim">เปลี่ยนบัญชี</a>
    </div>

    <div class="grid-2">
      <label class="f"><span>ชื่อ</span><input class="input" name="first_name" autocomplete="given-name" required></label>
      <label class="f"><span>นามสกุล</span><input class="input" name="last_name" autocomplete="family-name" required></label>
    </div>
    <div class="grid-2">
      <label class="f"><span>ชื่อเล่น <i>(ไม่บังคับ)</i></span><input class="input" name="nickname" autocomplete="nickname"></label>
      <label class="f"><span>เบอร์โทร</span><input class="input" name="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="08x-xxx-xxxx" required></label>
    </div>

    ${isStudent ? `<div class="f"><span class="muted small" style="display:block;margin-bottom:6px">ชั้นปี${info.suggested_year ? ' <i class="dim">(เดาจากรหัสนิสิต แก้ได้)</i>' : ''}</span>
      <div class="seg" id="year">${yearBtns.map(y => `<button type="button" data-v="${y}">${esc(IMF.YEAR[y])}</button>`).join('')}</div></div>` : ''}

    ${cat === 'eng' ? `<div class="f"><span class="muted small" style="display:block;margin-bottom:6px">กรุ๊ป</span>
      <div class="seg groups" id="group">${GROUPS.map(g => `<button type="button" data-v="${g}">${g}</button>`).join('')}</div></div>` : ''}

    ${cat === 'chula_student' ? `<label class="f"><span>คณะ</span><select class="input" name="affiliation"><option value="">เลือกคณะ</option>${FACULTIES.map(f => `<option>${f}</option>`).join('')}</select></label>` : ''}
    ${cat === 'chula_staff' ? `<label class="f"><span>หน่วยงาน / คณะ</span><input class="input" name="affiliation"></label>` : ''}
    ${cat === 'external' ? `<label class="f"><span>สถานศึกษา / องค์กร <i>(ไม่บังคับ)</i></span><input class="input" name="affiliation"></label>` : ''}

    <label class="f"><span>แพ้อาหาร <i>(ไม่บังคับ)</i></span><input class="input" name="food_allergy" placeholder="เช่น กุ้ง ถั่ว นม"></label>
    <label class="f"><span>รหัสเพื่อน <i>(ถ้ามีเพื่อนชวนมา)</i></span><input class="input mono" name="ref_code" maxlength="6" style="text-transform:uppercase;letter-spacing:3px" value="${esc(savedRef)}" placeholder="XXXXXX"></label>

    <label class="check"><input type="checkbox" name="consent">
      <span>ยินยอมให้ทีมงาน INTANIA MUSIC FEST 2027 เก็บและใช้ข้อมูลนี้เพื่อการลงทะเบียน การติดต่อ และการจัดงานครั้งนี้เท่านั้น</span></label>

    <div id="err" class="errtext"></div>
    <button class="btn big block" id="submit">ลงทะเบียน</button>
  </form>`;

  $('#switch').onclick = async (e) => { e.preventDefault(); await api.signOut(); location.reload(); };

  const pick = (box, v) => { if (!box) return; $$('button', box).forEach(b => b.classList.toggle('on', b.dataset.v === v)); box.dataset.value = v || ''; };
  $$('.seg').forEach(box => box.addEventListener('click', e => { const b = e.target.closest('button'); if (b) pick(box, b.dataset.v); }));
  if (info.suggested_year && $('#year')) pick($('#year'), info.suggested_year);

  $('#f').onsubmit = async (e) => {
    e.preventDefault();
    const f = e.target, btn = $('#submit'), err = $('#err');
    $$('.input', f).forEach(i => i.classList.remove('err'));
    err.textContent = '';
    const p = {
      first_name: f.first_name.value.trim(), last_name: f.last_name.value.trim(), nickname: f.nickname.value.trim(),
      phone: f.phone.value, food_allergy: f.food_allergy.value.trim(), ref_code: f.ref_code.value.trim().toUpperCase(),
      affiliation: f.affiliation ? f.affiliation.value.trim() : '',
      year: $('#year') ? $('#year').dataset.value : null, group_code: $('#group') ? $('#group').dataset.value : null,
      consent: f.consent.checked
    };
    // quick checks before hitting the server
    const bad = (el, msg) => { if (el) el.classList.add('err'); err.textContent = msg; (el || btn).scrollIntoView({ block: 'center', behavior: 'smooth' }); };
    if (!p.first_name) return bad(f.first_name, 'กรุณากรอกชื่อ');
    if (!p.last_name) return bad(f.last_name, 'กรุณากรอกนามสกุล');
    if (!/^0\d{8,9}$/.test(p.phone.replace(/\D/g, ''))) return bad(f.phone, IMF.errMsg('BAD_PHONE'));
    if ($('#year') && !p.year) return bad($('#year'), 'กรุณาเลือกชั้นปี');
    if ($('#group') && !p.group_code) return bad($('#group'), 'กรุณาเลือกกรุ๊ป');
    if (cat === 'chula_student' && !p.affiliation) return bad(f.affiliation, 'กรุณาเลือกคณะ');
    if (!p.consent) return bad(null, IMF.errMsg('NO_CONSENT'));

    btn.disabled = true; btn.textContent = 'กำลังบันทึก…';
    try {
      const res = await rpc('register', { p });
      localStorage.removeItem('imf_ref');
      success(res.ref_code, p.first_name);
    } catch (ex) {
      const m = IMF.errMsg(ex);
      if (/BAD_REF/.test(ex.message || '')) bad(f.ref_code, m); else bad(null, m);
      if (/ALREADY_REGISTERED/.test(ex.message || '')) setTimeout(() => location.replace('me.html'), 1200);
      btn.disabled = false; btn.textContent = 'ลงทะเบียน';
    }
  };

  function success(code, name) {
    window.scrollTo(0, 0);
    root.innerHTML = `<div class="stack center">
      <div style="font-size:56px">🎉</div>
      <h1>ลงทะเบียน<br>สำเร็จ!</h1>
      <p class="muted">เจอกัน ${esc(name)} ที่ลานอินทาเนีย 28 ม.ค. 2027</p>
      <div class="card white stack">
        <div class="kicker" style="color:#555">รหัสชวนเพื่อนของคุณ</div>
        <div class="code-box" style="border-color:#000"><b>${esc(code)}</b><button class="btn small" id="cp" style="background:#000;color:#fff;border-color:#000">คัดลอก</button></div>
        <div class="small" style="color:#555">เพื่อนลงทะเบียนด้วยรหัสนี้ คุณได้แต้มไปแลกของในวันงาน</div>
        <button class="btn block" id="share" style="background:#000;color:#fff;border-color:#000">ส่งลิงก์ชวนเพื่อน</button>
      </div>
      <a class="btn ghost block" href="me.html">ไปที่บัตร & แต้มของฉัน</a>
    </div>`;
    $('#cp').onclick = () => IMF.copy(code);
    $('#share').onclick = () => IMF.shareInvite(code);
  }
})();
</script>
</body>
</html>
