<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c9363a">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>INTANIA MUSIC FEST</title>
<meta name="description" content="28 มกราคม 2570 · 17:00–22:00 น. · ลานอินทาเนีย คณะวิศวกรรมศาสตร์ จุฬาลงกรณ์มหาวิทยาลัย">
<meta property="og:title" content="INTANIA MUSIC FEST">
<meta property="og:description" content="กลับมาอีกครั้ง เทศกาลดนตรีสุดยิ่งใหญ่ · 28 มกราคม 2570 · ลงทะเบียนเลย">
<meta property="og:image" content="assets/hero.jpg">
<link rel="icon" href="assets/icon.png">
<link rel="preload" as="image" href="assets/hero.jpg" fetchpriority="high">
<link rel="stylesheet" href="assets/style.css?v=70">
<script src="assets/config.js"></script>
<script src="assets/vendor/supabase.js"></script>
<script src="assets/app.js?v=70"></script>
</head>
<body>
<main class="stage" id="root"><div class="spinner" style="margin-top:160px"></div></main>

<script>
(async () => {
  const { api, rpc, $, esc, fmt, EVENT, icon, REASON } = IMF;
  const root = $('#root');
  const { info, settings: s } = await IMF.boot({ noArt: true });

  // ---------- not registered yet: the Save-the-date page ----------
  if (!info.registered) {
    const open = s.eng_round_open || s.general_round_open;
    const cal = IMF.calendarLinks();
    let cta;
    if (open) cta = `<a class="btn red big block" href="register.html">${info.logged_in ? 'ลงทะเบียน' : 'ลงทะเบียน / เข้าสู่ระบบ'}</a>`;
    else cta = `<div class="card center"><b>ยังไม่เปิดลงทะเบียน</b></div>${info.logged_in ? '' : '<a class="btn ghost block" href="register.html">เข้าสู่ระบบ</a>'}`;
    root.innerHTML = `<div class="home">
      <div class="poster">
        <div class="hero"><img src="assets/hero.jpg" width="1080" height="572" alt="INTANIA MUSIC FEST"></div>
        <div class="pad stack">
          <div class="tagline">กลับมาอีกครั้ง เทศกาลดนตรีสุดยิ่งใหญ่<span class="band">ที่ชาวอินทาเนีย และเพื่อนจุฬาฯ ห้ามพลาด !</span></div>
          <div>
            <div class="date">28 มกราคม 2570</div>
            <div class="time">17:00 – 22:00 น.</div>
            <div class="place">ณ ลานอินทาเนีย คณะวิศวกรรมศาสตร์<br>จุฬาลงกรณ์มหาวิทยาลัย</div>
          </div>
        </div>
      </div>
      <div class="side pad stack">
        ${IMF.countdownHTML()}
        <div class="calbtns">
          <a class="calbtn" href="${cal.google}" target="_blank" rel="noopener"><img src="assets/gcal.png" alt="">Google Calendar</a>
          <a class="calbtn" href="${cal.ics}"><img class="apple" src="assets/apple.png" alt="">Apple Calendar</a>
        </div>
        ${cta}
      </div>
    </div>`;
    IMF.startCountdown(root, EVENT.start);
    return;
  }

  // ---------- registered: points and the invite campaign ----------
  let me, history = [], friends = null;
  try {
    me = await api.myProfile();
    [history, friends] = await Promise.all([rpc('my_points_history').catch(() => []), s.referral_open ? rpc('my_friends').catch(() => null) : null]);
  } catch (e) { root.innerHTML = `<div class="inner"><div class="card" style="margin-top:60px">${esc(IMF.errMsg(e))}</div></div>`; return; }
  const sum = (r) => history.filter(h => h.reason === r).reduce((a, h) => a + h.delta, 0);

  root.innerHTML = `<div class="art"></div><div class="inner stack" style="position:relative">
    <img class="homelogo" src="assets/logo.png" alt="INTANIA MUSIC FEST">
    <div class="hello"><span>สวัสดี</span> <b>${esc(me.nickname || me.first_name)}</b></div>
    <div class="pcard"><div>
      <div class="top"><span class="lbl">MY POINT</span>${me.group_code ? `<span class="grp">${icon('users', 14, 2)}Group ${esc(me.group_code)}</span>` : ''}</div>
      <div class="num"><b>${fmt(me.points)}</b><span>PT</span></div>
      <div class="brk"><div><b>+${fmt(sum('referral'))}</b><span>ชวนเพื่อน</span></div><div><b>+${fmt(sum('activity'))}</b><span>กิจกรรม</span></div><div><b>+${fmt(sum('signup_bonus') + sum('code'))}</b><span>โค้ด</span></div></div>
      <div class="acts ${s.codes_open ? 'three' : ''}">
        ${s.rewards_open ? `<a class="pbtn red" href="rewards.html">${icon('gift', 18, 2)}แลกของรางวัล</a>` : `<span class="pbtn soonish">${icon('gift', 17, 2)}ของรางวัลเร็วๆ นี้</span>`}
        <button class="pbtn" id="hist">${icon('clock', 17, 2)}ประวัติ Point</button>
        ${s.codes_open ? `<button class="pbtn" id="code">${icon('star', 17, 2)}กรอกโค้ด</button>` : ''}
      </div>
    </div></div>
    ${s.referral_open ? IMF.inviteCard(me, friends) : ''}
  </div>`;

  IMF.watchMe(me);
  if ($('#code')) $('#code').onclick = () => IMF.codeModal(() => location.reload());
  $('#hist').onclick = () => IMF.modal(`<div class="stack"><div class="row" style="justify-content:space-between"><h2>ประวัติ Point</h2><button class="btn ghost small" data-close>ปิด</button></div>
    ${history.length ? `<ul class="list small">${history.map(h => `<li><div style="flex:1"><b>${esc(REASON[h.reason] || h.reason)}</b>${h.detail ? ` <span class="muted">· ${esc(h.detail)}</span>` : ''}<div class="dim">${IMF.dateTH(h.created_at)}</div></div>
      <b style="color:${h.delta > 0 ? '#0f9d58' : '#b3261e'}">${h.delta > 0 ? '+' : ''}${h.delta}</b></li>`).join('')}</ul>` : '<div class="dim center">ยังไม่มี</div>'}</div>`);
})();
</script>
</body>
</html>
