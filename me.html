<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c9363a">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>บัตรเข้างาน · INTANIA MUSIC FEST</title>
<link rel="icon" href="assets/icon.png">
<link rel="stylesheet" href="assets/style.css?v=66">
<script src="assets/config.js"></script>
<script src="assets/vendor/supabase.js"></script>
<script src="assets/vendor/qrcode.js"></script>
<script src="assets/app.js?v=66"></script>
</head>
<body>
<main class="stage"><div class="inner" id="root"><div class="spinner" style="margin-top:120px"></div></div></main>

<script>
(async () => {
  const { api, rpc, $, esc, fmt, CATEGORY, YEAR, icon } = IMF;
  const root = $('#root');
  const { info, settings } = await IMF.boot();
  const gate = (body) => `<div class="soon"><img class="soon-logo" src="${IMF.LOGO}" alt="INTANIA MUSIC FEST">${body}</div>`;

  if (!info.logged_in) {
    root.innerHTML = gate(`<span class="sq-lock">${icon('lock', 30, 1.8)}</span><h2>เข้าสู่ระบบเพื่อรับบัตรเข้างาน</h2><a class="btn red big block" href="register.html" data-next="me.html">ลงทะเบียน / เข้าสู่ระบบ</a>`);
    return;
  }
  if (!info.registered) {
    root.innerHTML = gate(`<h2>ยังไม่ได้ลงทะเบียน</h2><a class="btn red big block" href="register.html" data-next="me.html">ลงทะเบียน</a>`);
    return;
  }
  if (!settings.ticket_open && !info.is_admin) {
    root.innerHTML = IMF.comingSoon(settings.ticket_countdown_at ? IMF.countdownHTML() : '');
    if (settings.ticket_countdown_at) IMF.startCountdown(root, settings.ticket_countdown_at);
    return;
  }

  let me;
  try { me = await api.myProfile(); } catch (e) { root.innerHTML = `<div class="card" style="margin-top:60px">${esc(IMF.errMsg(e))}</div>`; return; }

  const info2 = (p) => (p.student_id
    ? [['ชื่อ', p.first_name + ' ' + p.last_name, 1], ['รหัสนิสิต', p.student_id], ['ชั้นปี', p.year ? YEAR[p.year] : '–'], ['คณะ', p.faculty || '–', 1]]
    : [['ชื่อ', p.first_name + ' ' + p.last_name, 1], ['ประเภท', CATEGORY[p.category], 1]])
    .map(([k, v, full]) => `<div class="${full ? 'full' : ''}"><small>${k}</small><b>${esc(v)}</b></div>`).join('');
  const timeTH = (d) => new Date(d).toLocaleString('th-TH', { hour: '2-digit', minute: '2-digit' }) + ' น. · ' + new Date(d).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' });

  let qrTimer = null, tickTimer = null;
  function render(p) {
    clearTimeout(qrTimer); clearInterval(tickTimer);
    // after check-in the QR stays: it's also used for activity points inside the event
    const mid = `${p.checked_in_at ? `<div class="tk-ok">${icon('check', 22, 3)}<b>เข้างานแล้ว</b><span>${timeTH(p.checked_in_at)}</span></div>` : ''}<div class="tk-mid"><div class="qr" id="qr"><div class="spinner" style="border-color:#e6d8d9;border-top-color:#c8102e"></div></div>
          <div style="width:100%"><div class="tk-timer">${icon('clock', 16, 2)}<span id="qrnote">QR เปลี่ยนใหม่ทุก 3 นาที</span></div><div class="tk-bar" style="margin-top:6px"><i id="qrbar"></i></div></div></div>`;
    root.innerHTML = `<div class="center-v">${!settings.ticket_open ? '<div class="center" style="margin-bottom:10px"><span class="chip warn">หน้าบัตรปิดอยู่ · แอดมินเห็น</span></div>' : ''}
      <div class="tk"><div class="tk-h"><img src="${IMF.LOGO}" alt="INTANIA MUSIC FEST"><div><small>บัตรเข้างาน</small><b>28.01.2570 · 17:00</b></div></div>
      ${mid}<div class="tk-info">${info2(p)}</div></div></div>`;
    startQR();
  }

  // the QR is only valid for a few minutes: fetch a new one when it runs out and whenever the page comes back
  function startQR() {
    let until = 0;
    const load = async () => {
      clearTimeout(qrTimer);
      if (!$('#qr')) return;
      try {
        const r = await rpc('my_qr');
        $('#qr').innerHTML = IMF.qrSvg(r.code);
        until = Date.now() + r.expires_in * 1000;
        qrTimer = setTimeout(load, r.expires_in * 1000 + 500);
      } catch (e) { $('#qrnote').textContent = 'โหลด QR ไม่ได้ กำลังลองใหม่…'; qrTimer = setTimeout(load, 5000); }
    };
    tickTimer = setInterval(() => {
      if (!until || !$('#qrbar')) return;
      const left = Math.max(0, Math.round((until - Date.now()) / 1000));
      $('#qrbar').style.width = (left / 180 * 100) + '%';
      $('#qrnote').innerHTML = `QR เปลี่ยนใหม่ใน <b style="color:#1a0305">${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}</b>`;
    }, 1000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden && $('#qr')) load(); });
    load();
  }

  render(me);

  // staff scanned the ticket / gave activity points → pop up straight away (no refresh needed)
  IMF.watchMe(me, {
    onCheckin: (p) => {
      render(p);
      if (navigator.vibrate) navigator.vibrate([80, 60, 120]);
      IMF.modal(`<div class="done"><span class="okdisc">${icon('check', 64, 2.8)}</span><h2>เข้างานสำเร็จ!</h2>
        <div class="what">${esc(p.first_name)} ${esc(p.last_name)}</div><div class="muted">${new Date(p.checked_in_at).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })} น.</div>
        <button class="btn red block" data-close style="margin-top:12px">ตกลง</button></div>`);
    }
  });
})();
</script>
</body>
</html>
