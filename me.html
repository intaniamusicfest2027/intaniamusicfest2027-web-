<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a0305">
<title>บัตรของฉัน · INTANIA MUSIC FEST</title>
<link rel="icon" href="assets/icon.png">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/config.js"></script>
<script src="assets/vendor/supabase.js"></script>
<script src="assets/vendor/qrcode.js"></script>
<script src="assets/app.js"></script>
</head>
<body>
<main class="stage"><div class="inner" id="root"><div class="spinner" style="margin-top:120px"></div></div></main>

<script>
(async () => {
  const { api, rpc, $, esc, fmt, CATEGORY, YEAR, REASON } = IMF;
  const root = $('#root');
  const { info, settings } = await IMF.boot();

  if (!info.logged_in) {
    root.innerHTML = `<div class="stack"><h1 class="page-title">บัตรของฉัน</h1>
      <p class="muted center" style="margin:0">เข้าสู่ระบบด้วยบัญชีที่ใช้ลงทะเบียน</p>
      <button class="btn big block" id="login">เข้าสู่ระบบด้วย <b>Google</b></button>
      <div class="center"><a class="small dim" href="register.html">ยังไม่ได้ลงทะเบียน? ลงทะเบียนที่นี่</a></div></div>`;
    $('#login').onclick = () => api.signIn().catch(e => IMF.toast(IMF.errMsg(e), true));
    return;
  }

  let me, history;
  try {
    me = await api.myProfile();
    if (!me) { location.replace('register.html'); return; }
    history = await rpc('my_points_history');
  } catch (e) { root.innerHTML = `<div class="card" style="margin-top:60px">${esc(IMF.errMsg(e))}</div>`; return; }

  const showQR = settings.ticket_open || settings.redeem_open;
  const fields = me.student_id
    ? [['รหัสนิสิต', me.student_id], ['ชั้นปี', me.year ? YEAR[me.year] : '–'], ['คณะ', me.faculty || '–', true]]
    : [['ประเภท', CATEGORY[me.category], true]];

  root.innerHTML = `<div class="stack" style="padding-top:26px">
    ${me.checked_in_at ? `<div class="got"><b>✅ รับบัตรแล้ว</b>เข้างานเมื่อ ${IMF.dateTH(me.checked_in_at)}</div>` : ''}
    <div class="ticket">
      <div class="t-head"><img src="assets/logo.png" alt="INTANIA MUSIC FEST"><b>บัตรเข้างาน</b></div>
      <div class="t-body">
        <div class="name">${esc(me.first_name)} ${esc(me.last_name)}</div>
        <div class="kv">${fields.map(([k, v, full]) => `<div class="${full ? 'full' : ''}"><small>${k}</small><b>${esc(v)}</b></div>`).join('')}</div>
      </div>
      <div class="cut"><i></i><b></b></div>
      <div class="t-body center">
        ${showQR ? `<div class="qr" id="qr"></div><div class="small" style="margin-top:10px;color:#6b4a4d">${me.checked_in_at ? 'ใช้ QR นี้ที่จุดแลกของรางวัลและจุดกิจกรรม' : 'แสดง QR นี้ให้ทีมงานสแกนที่จุดรับบัตร'}</div>`
          : `<div style="padding:8px 0"><b>ลงทะเบียนเรียบร้อย</b><div class="small" style="color:#6b4a4d">QR สำหรับรับบัตรเข้างานจะแสดงที่นี่ก่อนวันงาน</div></div>`}
      </div>
    </div>

    <div class="card stack">
      <div class="row" style="justify-content:space-between;align-items:flex-end">
        <div><div class="small muted">แต้มของฉัน</div><div class="points-big">${fmt(me.points)}</div></div>
        <a class="btn ghost small" href="rewards.html">ดูของรางวัล</a>
      </div>
      ${history.length ? `<ul class="list small">${history.map(h => `<li>
          <div style="flex:1"><b>${esc(REASON[h.reason] || h.reason)}</b>${h.detail ? ` <span class="muted">· ${esc(h.detail)}</span>` : ''}<div class="dim">${IMF.dateTH(h.created_at)}</div></div>
          <b style="color:${h.delta > 0 ? 'var(--ok)' : 'var(--bad)'}">${h.delta > 0 ? '+' : ''}${h.delta}</b></li>`).join('')}</ul>` : ''}
    </div>

    ${settings.referral_open ? IMF.inviteCard(me, settings) : ''}

    <details class="card">
      <summary style="cursor:pointer;font-weight:600">แก้ไขชื่อเล่น / เบอร์โทร</summary>
      <form id="edit" class="stack" style="margin-top:14px">
        <label class="f"><span>ชื่อเล่น</span><input class="input" name="nickname" value="${esc(me.nickname || '')}"></label>
        <label class="f"><span>เบอร์โทร</span><input class="input" name="phone" type="tel" inputmode="numeric" value="${esc(me.phone)}"></label>
        <button class="btn small">บันทึก</button>
      </form>
    </details>
    <div class="center"><a href="#" id="logout" class="small dim">ออกจากระบบ (${esc(me.email)})</a></div>
  </div>`;

  if (showQR) $('#qr').innerHTML = IMF.qrSvg('IMF27:' + me.qr_token);
  $('#logout').onclick = async (e) => { e.preventDefault(); await api.signOut(); location.href = 'index.html'; };
  $('#edit').onsubmit = async (e) => {
    e.preventDefault();
    try { await rpc('update_my_profile', { p: { nickname: e.target.nickname.value.trim(), phone: e.target.phone.value } }); IMF.toast('บันทึกแล้ว'); }
    catch (ex) { IMF.toast(IMF.errMsg(ex), true); }
  };
})();
</script>
</body>
</html>
