<body>
<main class="stage"><div class="inner" id="root"><div class="spinner" style="margin-top:120px"></div></div></main>

<script>
(async () => {
  const { $, esc, EVENT } = IMF;
  await IMF.boot();
  const ch = [['Instagram', '@' + EVENT.ig, 'https://www.instagram.com/' + EVENT.ig + '/', 'assets/ig-logo.png'],
              ['TikTok', '@' + EVENT.tiktok, 'https://www.tiktok.com/@' + EVENT.tiktok, 'assets/tiktok-logo.png']];
  $('#root').innerHTML = `<div class="ph"><h1>ติดตาม</h1></div><div class="stack" style="margin-top:0">
    ${ch.map(([name, handle, url, logo]) => `<a class="card follow2" href="${esc(url)}" target="_blank" rel="noopener"><img src="${logo}" alt="">
      <span style="flex:1"><b>${name}</b><span class="muted">${esc(handle)}</span></span><span class="go">ติดตาม</span></a>`).join('')}</div>`;
})();
</script>
