<!DOCTYPE html>
<html lang="th">
<head>

<body>
<main class="stage"><div class="inner" id="root"><div class="spinner" style="margin-top:120px"></div></div></main>

<script>
(async () => {
  const { $, esc } = IMF;
  const root = $('#root');
  const { info, settings } = await IMF.boot();
  if (!settings.map_open && !info.is_admin) { root.innerHTML = IMF.comingSoon(); return; }
  const W = 350, H = 640;
  const box = (x, y, w, h, label, cls = '') => `<div class="${cls}" style="left:${x / W * 100}%;top:${y / H * 100}%;width:${w / W * 100}%;height:${h / H * 100}%">${label}</div>`;
  const pin = (x, y, cls, label, txt) => `<div class="pin ${cls}" role="img" aria-label="${label}" style="left:${x / W * 100}%;top:${y / H * 100}%">${txt}</div>`;
  const ENT = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/></svg>';
  const map = [
    box(166, 0, 14, 640, '', 'road'),
    box(8, 10, 66, 70, 'โรงอาหาร'), box(84, 14, 76, 54, 'อาคาร<br>จรัญ สนิทวงศ์'), box(222, 14, 120, 126, 'อาคารวิศวฯ<br>100 ปี'),
    box(8, 92, 38, 140, ''), box(50, 92, 110, 104, 'ลาน Intania', 'lan'), box(50, 198, 110, 26, 'เวที', 'stage2'),
    box(8, 236, 152, 160, 'ตึก 3'), box(8, 400, 38, 108, ''), box(54, 412, 100, 84, 'สวนรวมใจ'),
    box(182, 214, 34, 376, 'โซนร้านอาหาร', 'food'), box(222, 214, 80, 100, 'ตึก 2'), box(222, 336, 80, 196, 'ตึก 1'),
    ...[226, 286, 360, 440, 506].map(y => box(312, y, 28, 26, '')),
    box(222, 556, 120, 74, 'อาคารวิศวฯ<br>ไฟฟ้า'), box(98, 592, 64, 40, 'ลงทะเบียน', 'reg'),
    pin(186, 6, 'aid', 'ปฐมพยาบาล', '+'), pin(140, 70, 'wc', 'ห้องน้ำ', 'WC'), pin(236, 110, 'wc', 'ห้องน้ำ', 'WC'), pin(132, 226, 'wc', 'ห้องน้ำ', 'WC'),
    pin(14, 60, 'ent', 'ทางเข้า', ENT), pin(30, 606, 'ent', 'ทางเข้า', ENT)
  ].join('');
  const lg = [['#5b2a9e', 'เวที'], ['#d0336f', 'ลาน Intania'], ['#e8742a', 'ร้านอาหาร'], ['#8a5a1e', 'ลงทะเบียน']].map(([c, t]) => `<span><i style="background:${c}"></i>${t}</span>`).join('')
    + [['#2f8fd6', 'ห้องน้ำ'], ['#e01e2a', 'ปฐมพยาบาล'], ['#ffd23f', 'ทางเข้า']].map(([c, t]) => `<span><i class="d" style="background:${c}"></i>${t}</span>`).join('');
  root.innerHTML = `<div class="ph"><h1>แผนผังงาน</h1>${settings.map_open ? '' : '<span class="chip warn">ปิดอยู่ · แอดมินเห็น</span>'}</div>
    <div class="map">${map}</div><div class="legend2" style="margin-top:20px">${lg}</div>`;
})();
</script>
</body>
</html>
