<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a0305">
<title>ของรางวัล · INTANIA MUSIC FEST</title>
<link rel="icon" href="assets/icon.png">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/config.js"></script>
<script src="assets/vendor/supabase.js"></script>
<script src="assets/app.js"></script>
</head>
<body>
<main class="stage"><div class="inner m stack" id="root"><div class="spinner" style="margin-top:120px"></div></div></main>

<script>
(async () => {
  const { api, rpc, $, $$, esc, fmt, REASON } = IMF;
  const root = $('#root');
  const { info } = await IMF.boot();
  let list, acts = [], me = null, history = [];
  try {
    [list, acts] = await Promise.all([api.rewards.list(), api.activities.list().catch(() => [])]);
    if (info.registered) [me, history] = await Promise.all([api.myProfile().catch(() => null), rpc('my_points_history').catch(() => [])]);
  } catch (e) { root.innerHTML = `<div class="card" style="margin-top:60px">${esc(IMF.errMsg(e))}</div>`; return; }

  const stockTxt = (r) => r.stock != null && r.stock <= 0 ? 'หมดแล้ว' : r.stock != null ? 'เหลือ ' + fmt(r.stock) + ' ชิ้น' : 'มีจำนวนจำกัด';
  const how = `<div class="card small"><b>วิธีแลก</b> · นำ QR ใน<a href="me.html">บัตรของฉัน</a>ไปที่จุดแลกของรางวัลในวันงาน ทีมงานจะสแกนและตัดแต้มให้ (แลกผ่านเว็บไม่ได้)</div>`;

  root.innerHTML = `<h1 class="page-title">ของรางวัล</h1>
    ${me ? `<div class="card row" style="justify-content:space-between"><span class="muted">แต้มของฉัน</span><b style="font-size:30px;line-height:1">${fmt(me.points)}</b></div>` : ''}
    <div class="subtabs" id="st">
      <button data-t="rewards" class="on">ของรางวัล</button><button data-t="earn">วิธีสะสมแต้ม</button>${me ? '<button data-t="history">ประวัติแต้ม</button>' : ''}
    </div>

    <section id="p-rewards" class="stack">${how}
      ${list.length ? `<div class="rewards">${list.map(r => {
        const out = r.stock != null && r.stock <= 0;
        return `<div class="reward ${out ? 'out' : ''}" data-id="${r.id}">
          <div class="pic" ${r.image ? `style="background-image:url('${esc(r.image)}')"` : ''}>${r.image ? '' : '🎁'}</div>
          <div class="body"><div class="nm">${esc(r.name)}</div>
            <div class="cost">${fmt(r.cost)} แต้ม</div><div class="st">${stockTxt(r)}</div></div></div>`;
      }).join('')}</div>` : '<div class="card center muted">ของรางวัลจะประกาศเร็ว ๆ นี้</div>'}
    </section>

    <section id="p-earn" class="stack hide">
      <div class="card stack"><h3>ชวนเพื่อน</h3><div class="muted">ส่งรหัสชวนเพื่อนของคุณให้เพื่อนกรอกตอนลงทะเบียน ได้แต้มทั้งคนชวนและคนถูกชวน</div>
        <a class="btn ghost small" style="align-self:flex-start" href="${me ? 'me.html' : 'register.html'}">${me ? 'ดูรหัสของฉัน' : 'ลงทะเบียนรับรหัส'}</a></div>
      ${acts.length ? `<div class="card"><h3 style="margin-bottom:6px">กิจกรรมในงาน</h3><ul class="list">${acts.map(a => `<li><div style="flex:1">${esc(a.name)}</div><b style="color:var(--ok)">+${fmt(a.points)} แต้ม</b></li>`).join('')}</ul>
        <div class="hint">ร่วมกิจกรรมแล้วให้ทีมงานสแกน QR ในบัตรของคุณ · รับได้กิจกรรมละ 1 ครั้ง</div></div>` : '<div class="card muted center">กิจกรรมสะสมแต้มอื่น ๆ จะประกาศเร็ว ๆ นี้</div>'}
    </section>

    <section id="p-history" class="hide">
      <div class="card">${history.length ? `<ul class="list small">${history.map(h => `<li>
        <div style="flex:1"><b>${esc(REASON[h.reason] || h.reason)}</b>${h.detail ? ` <span class="muted">· ${esc(h.detail)}</span>` : ''}<div class="dim">${IMF.dateTH(h.created_at)}</div></div>
        <b style="color:${h.delta > 0 ? 'var(--ok)' : 'var(--bad)'}">${h.delta > 0 ? '+' : ''}${h.delta}</b></li>`).join('')}</ul>` : '<div class="dim center">ยังไม่มีประวัติแต้ม</div>'}</div>
    </section>`;

  $('#st').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    $$('#st button').forEach(x => x.classList.toggle('on', x === b));
    ['rewards', 'earn', 'history'].forEach(t => { const s = $('#p-' + t); if (s) s.classList.toggle('hide', t !== b.dataset.t); });
  };

  // tap a reward → detail pop-up
  root.addEventListener('click', e => {
    const card = e.target.closest('.reward[data-id]'); if (!card) return;
    const r = list.find(x => x.id == card.dataset.id);
    IMF.modal(`<div class="stack">
      ${r.image ? `<img src="${esc(r.image)}" alt="" style="width:100%;border-radius:14px">` : ''}
      <h2>${esc(r.name)}</h2>
      ${r.description ? `<div class="muted" style="white-space:pre-line">${esc(r.description)}</div>` : ''}
      <div class="row" style="justify-content:space-between"><b style="font-size:24px;color:var(--red-ink)">${fmt(r.cost)} แต้ม</b><span class="muted">${stockTxt(r)}</span></div>
      ${me ? `<div class="small muted">${me.points >= r.cost ? 'แต้มของคุณพอแลกแล้ว ✓' : `คุณมี ${fmt(me.points)} แต้ม ขาดอีก ${fmt(r.cost - me.points)} แต้ม`}</div>` : ''}
      <div class="small muted">แลกได้ที่จุดแลกของรางวัลในวันงาน โดยให้ทีมงานสแกน QR ในบัตรของคุณ</div>
      <button class="btn ghost block" data-close>ปิด</button></div>`);
  });
})();
</script>
</body>
</html>
