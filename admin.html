<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c9363a">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>หลังบ้าน · INTANIA MUSIC FEST</title>
<link rel="icon" href="assets/icon.png">
<link rel="stylesheet" href="assets/style.css?v=70">
<script src="assets/config.js"></script>
<script src="assets/vendor/supabase.js"></script>
<script src="assets/vendor/chart.umd.js"></script>
<script src="assets/app.js?v=70"></script>
<style>
  .chart-box { position: relative; height: 230px; }
  .legend span:nth-child(3n+1) { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 4px 12px; font-size: 13px; color: var(--ink-2); margin-top: 12px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 7px; }
  .legend b { color: #fff; text-align: right; font-variant-numeric: tabular-nums; }
  .legend span:nth-child(3n) { text-align: right; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .pie-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
  .pie-center b { font-size: 34px; line-height: 1; }
  .card { backdrop-filter: none; background: #1c0709; }
  .grid-2 > .card, .grid-4 > .stat { min-width: 0; }
  tr.click { cursor: pointer; } tr.click:hover td { background: rgba(255, 255, 255, .05); }
  .tight3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) !important; gap: 10px; }
  .tight3 .stat .v { font-size: 26px; }
  @media (max-width: 600px) { .amain .grid-2 { grid-template-columns: minmax(0, 1fr) !important; } }
  .osec { display: flex; align-items: center; gap: 8px; margin: 22px 2px 10px; font-size: 19px; }
  .rcl { display: flex; flex-direction: column; }
  .rcr { padding: 12px 0; border-top: 1px solid rgba(255,255,255,.1); display: flex; flex-direction: column; gap: 10px; }
  .rcr:first-child { border-top: 0; }
  .rch { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .rch b { font-size: 17px; letter-spacing: 1px; }
  .engb2 { padding: 2px 9px; border-radius: 999px; background: var(--red); color: #fff; font-size: 11.5px; font-weight: 800; }
  .rcf { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end; }
  .rcf label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--ink-2); }
  .rcf .numin { width: 84px; }
  .rcb { margin-left: auto; display: flex; gap: 6px; }
  .thumb { width: 64px; height: 64px; border-radius: 10px; background: #3a1418 center / cover no-repeat; display: grid; place-items: center; cursor: pointer; font-size: 12px; color: var(--ink-3); text-align: center; flex: none; }
</style>
</head>
<body>
<main class="stage"><div id="root"><div class="spinner" style="margin-top:120px"></div></div></main>

<script>
(async () => {
  const { api, rpc, $, $$, esc, fmt, CATEGORY, YEAR, GENDER, REASON, GROUPS, icon } = IMF;
  const root = $('#root');
  const { info } = await IMF.boot({ admin: true });

  if (!info.logged_in) {
    root.innerHTML = `<div class="inner stack" style="max-width:420px;margin:0 auto"><div class="ph"><h1>หลังบ้าน</h1></div><div id="login" class="stack"></div></div>`;
    IMF.loginButtons($('#login')); return;
  }
  if (!info.is_admin) { root.innerHTML = `<div class="inner"><div class="card" style="margin-top:60px">บัญชี ${esc(info.email)} ไม่ใช่แอดมิน · <a href="index.html">กลับหน้าเว็บ</a></div></div>`; return; }

  const TABS = [['overview', 'ภาพรวม'], ['people', 'รายชื่อ'], ['referral', 'การชวน'], ['codes', 'Redeem Code'], ['rewards', 'ของรางวัล & กิจกรรม'], ['settings', 'ตั้งค่า'], ['team', 'ทีมงาน']];
  root.innerHTML = `<header class="ahead"><div class="in">
      <a class="backbtn" href="index.html" aria-label="กลับหน้าเว็บ">${icon('back', 22)}</a>
      <span class="brandl"><img src="${IMF.LOGO}" alt="INTANIA MUSIC FEST"><b>หลังบ้าน</b></span>
      <nav class="atabs" id="tabs">${TABS.map(([k, l], i) => `<button data-t="${k}" class="${i ? '' : 'on'}">${l}</button>`).join('')}</nav>
      <span class="roleb">${info.is_owner ? 'OWNER' : 'ADMIN'}</span>
    </div></header>
    <div class="amain">${TABS.map(([k], i) => `<section id="t-${k}" class="${i ? 'hide' : ''}"></section>`).join('')}</div>`;

  const tabFn = { overview, people, referral: referralTab, codes: codesTab, rewards: rewardsTab, settings: settingsTab, team: teamTab };
  let active = 'overview';
  $('#tabs').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    $$('#tabs button').forEach(x => x.classList.toggle('on', x === b));
    $$('.amain > section').forEach(x => x.classList.add('hide'));
    active = b.dataset.t; $('#t-' + active).classList.remove('hide'); tabFn[active]();
  };
  const fail = (el, e) => { el.innerHTML = `<div class="card">${esc(IMF.errMsg(e))}</div>`; };
  const yearTxt = (y) => y ? (YEAR[y] || y) : '–';
  const toggle = (k, on) => `<label class="switch"><input type="checkbox" data-k="${k}" ${on ? 'checked' : ''}><i></i></label>`;
  const srow = (label, ctrl) => `<div class="setting"><b>${label}</b>${ctrl}</div>`;
  const sec = (ic, title, body) => `<div class="card sec"><h3>${icon(ic, 19)}${title}</h3>${body}</div>`;

  // ---------------- overview ----------------
  Chart.defaults.color = '#f0c9cc';
  Chart.defaults.borderColor = 'rgba(255,255,255,.12)';
  Chart.defaults.font.family = "'Noto Sans Thai', system-ui, sans-serif";
  const PAL = ['#3987e5', '#d95926', '#199e70', '#c98500', '#d55181', '#0ca30c', '#9085e9', '#e66767'];
  const GREY = '#8f8083', SURFACE = '#1c0709';
  let charts = [];

  // items: [{label, n, color?}] → pie + legend with counts and %
  function pie(id, items) {
    const total = items.reduce((a, x) => a + x.n, 0) || 1;
    items.forEach((x, i) => { if (!x.color) x.color = PAL[i % PAL.length]; });
    charts.push(new Chart($('#' + id), {
      type: 'pie',
      data: { labels: items.map(x => x.label), datasets: [{ data: items.map(x => x.n), backgroundColor: items.map(x => x.color), borderColor: SURFACE, borderWidth: 2 }] },
      options: { maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ` ${c.label}: ${fmt(c.parsed)} คน (${(c.parsed / total * 100).toFixed(1)}%)` } } } }
    }));
    $('#' + id + 'L').innerHTML = items.map(x => `<span><i style="background:${x.color}"></i>${esc(x.label)}</span><b>${fmt(x.n)}</b><span>${(x.n / total * 100).toFixed(1)}%</span>`).join('');
  }
  const pieCard = (title, id) => `<div class="card"><div class="card-title"><h3>${title}</h3></div><div class="chart-box"><canvas id="${id}"></canvas></div><div class="legend" id="${id}L"></div></div>`;

  async function overview() {
    const el = $('#t-overview');
    el.innerHTML = '<div class="spinner"></div>';
    let s;
    try { s = await rpc('admin_stats'); } catch (e) { return fail(el, e); }
    charts.forEach(c => c.destroy()); charts = [];
    const pct = s.target ? Math.min(100, s.total / s.target * 100) : 0;

    el.innerHTML = `
      <div class="grid-4">
        <div class="stat"><div class="v">${fmt(s.total)}</div><div class="l">ลงทะเบียนทั้งหมด</div></div>
        <div class="stat"><div class="v">${fmt(s.checked_in)}</div><div class="l">เข้างานแล้ว (${s.total ? Math.round(s.checked_in / s.total * 100) : 0}%)</div></div>
        <div class="stat"><div class="v">${fmt(s.referred)}</div><div class="l">มาจากเพื่อนชวน</div></div>
        <div class="stat"><div class="v">${fmt(s.points_redeemed)}<small class="dim" style="font-size:18px"> / ${fmt(s.points_out)}</small></div><div class="l">Point ที่แลกแล้ว / แจกไป</div></div>
      </div>
      <div class="grid-2" style="margin-top:14px">
        <div class="card"><div class="card-title"><h3>เป้าหมาย ${fmt(s.target)} คน</h3></div>
          <div class="chart-box"><canvas id="cTarget"></canvas><div class="pie-center"><b>${pct.toFixed(1)}%</b><span class="small muted">${fmt(s.total)} / ${fmt(s.target)}</span></div></div>
          <div class="legend"><span><i style="background:#fff"></i>ลงทะเบียนแล้ว</span><b>${fmt(s.total)}</b><span>${pct.toFixed(1)}%</span><span><i style="background:#4a2a2d"></i>ยังขาด</span><b>${fmt(Math.max(0, s.target - s.total))}</b><span>${(100 - pct).toFixed(1)}%</span></div></div>
        ${pieCard('เพศ', 'cGender')}
        ${pieCard('ชั้นปี', 'cYear')}
        ${pieCard('คณะ', 'cFac')}
      </div>
      <div class="card" style="margin-top:14px"><div class="card-title"><h3>เพศ แยกตามประเภท</h3></div><div class="chart-box"><canvas id="cGenCat"></canvas></div><div class="legend" id="cGenCatL"></div></div>
      <h3 class="osec">${icon('share', 19)}เพื่อนชวน</h3>
      <div class="grid-4">
        <div class="stat"><div class="v">${fmt(s.referred)}</div><div class="l">ถูกเพื่อนชวน (${s.total ? Math.round(s.referred / s.total * 100) : 0}%)</div></div>
        <div class="stat"><div class="v">${fmt(s.inviters)}</div><div class="l">คนที่ชวนเพื่อน</div></div>
        <div class="stat"><div class="v">${fmt(s.eng_unlocked)}</div><div class="l">คนนอกที่เห็นของวิศวะ</div></div>
        <div class="stat"><div class="v">${fmt(s.codes_used)}</div><div class="l">ใช้ Redeem Code</div></div>
      </div>
      <div class="grid-2" style="margin-top:14px">
        ${pieCard('มาจากไหน', 'cSrc')}
        ${pieCard('เพศของคนที่ถูกชวน', 'cInvG')}
      </div>
      <div class="card" style="margin-top:14px"><div class="card-title"><h3>ชวนมากสุด</h3></div>
        ${s.top_inviters.length ? `<ul class="list">${s.top_inviters.map((t, i) => `<li><span class="dim" style="width:22px;text-align:center;font-weight:800">${i + 1}</span><div style="flex:1;min-width:0"><b>${esc(t.name)}</b><div class="small muted">${esc(CATEGORY[t.cat] || '')}${t.grp ? ' · Group ' + esc(t.grp) : ''}</div></div><b>${fmt(t.n)}</b><span class="small dim">คน</span></li>`).join('')}</ul>` : '<div class="dim">ยังไม่มี</div>'}</div>
      <div class="card" style="margin-top:14px"><div class="card-title"><h3>จำนวนคนแยกกรุ๊ป (นิสิตวิศวะ)</h3></div><div class="chart-box"><canvas id="cGroup"></canvas></div></div>
      <div class="card" style="margin-top:14px"><div class="card-title"><h3>ลงทะเบียนรายวัน</h3></div><div class="chart-box"><canvas id="cDay"></canvas></div></div>
      <div class="card" style="margin-top:14px"><div class="card-title"><h3>ของรางวัลที่แลกไป</h3></div>
        ${s.by_reward.length ? `<table class="t"><thead><tr><th>ของรางวัล</th><th style="text-align:right">แลกไป</th><th style="text-align:right">คงเหลือ</th></tr></thead><tbody>
          ${s.by_reward.map(r => `<tr><td>${esc(r.name)}</td><td style="text-align:right">${fmt(r.n)}</td><td style="text-align:right">${r.stock == null ? '∞' : fmt(r.stock)}</td></tr>`).join('')}</tbody></table>`
        : '<div class="dim">ยังไม่มีการแลก</div>'}</div>`;

    charts.push(new Chart($('#cTarget'), {
      type: 'doughnut',
      data: { labels: ['ลงทะเบียนแล้ว', 'ยังขาด'], datasets: [{ data: [s.total, Math.max(0, s.target - s.total)], backgroundColor: ['#ffffff', '#4a2a2d'], borderColor: SURFACE, borderWidth: 2 }] },
      options: { maintainAspectRatio: false, cutout: '72%', plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ` ${c.label} ${fmt(c.parsed)} คน` } } } }
    }));

    const g = s.by_gender;
    pie('cGender', [['male', 'ชาย'], ['female', 'หญิง'], ['other', 'LGBTQ+'], ['na', 'ไม่ระบุ']].map(([k, l]) => ({ label: l, n: g[k] || 0 }))
      .concat(g['-'] ? [{ label: 'ไม่มีข้อมูล', n: g['-'], color: GREY }] : []));
    const GKEYS = [['male', 'ชาย'], ['female', 'หญิง'], ['other', 'LGBTQ+'], ['na', 'ไม่ระบุ']];
    // gender inside each category: one stacked bar per category, genders in a fixed colour order
    const cats = Object.keys(CATEGORY).filter(c => s.gender_by_cat[c]);
    const gsets = GKEYS.concat(cats.some(c => s.gender_by_cat[c]['-']) ? [['-', 'ไม่มีข้อมูล']] : []).map(([k, l], i) => ({
      label: l, data: cats.map(c => s.gender_by_cat[c][k] || 0), backgroundColor: k === '-' ? GREY : PAL[i], borderColor: SURFACE, borderWidth: { top: 2 }, borderSkipped: false, maxBarThickness: 56 }));
    charts.push(new Chart($('#cGenCat'), {
      type: 'bar', data: { labels: cats.map(c => CATEGORY[c]), datasets: gsets },
      options: { maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ` ${c.dataset.label}: ${fmt(c.parsed.y)} คน` } } },
        scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, beginAtZero: true, ticks: { precision: 0 } } } }
    }));
    $('#cGenCatL').innerHTML = gsets.map(d => { const n = d.data.reduce((a, x) => a + x, 0); return `<span><i style="background:${d.backgroundColor}"></i>${esc(d.label)}</span><b>${fmt(n)}</b><span>${s.total ? (n / s.total * 100).toFixed(1) : 0}%</span>`; }).join('');
    const src = s.by_source;
    pie('cSrc', [{ label: 'สมัครเอง', n: src.none, color: GREY }, { label: 'วิศวะชวน', n: src.eng }, { label: 'คนอื่นชวน', n: src.other }, { label: 'โค้ดพิเศษ', n: src.special }, { label: 'Redeem Code', n: src.code }]);
    const ig = s.invited_gender;
    pie('cInvG', GKEYS.map(([k, l]) => ({ label: l, n: ig[k] || 0 })).concat(ig['-'] ? [{ label: 'ไม่มีข้อมูล', n: ig['-'], color: GREY }] : []));
    const y = s.by_year;
    pie('cYear', ['1', '2', '3', '4', '5+'].map(k => ({ label: YEAR[k], n: y[k] || 0 }))
      .concat(y['-'] ? [{ label: 'ไม่ใช่นิสิต / ไม่ทราบ', n: y['-'], color: GREY }] : []));
    // top 7 faculties + everything else in one grey slice
    const fac = s.by_faculty.slice(0, 7).map(f => ({ label: f.name, n: f.n }));
    const rest = s.by_faculty.slice(7).reduce((a, f) => a + f.n, 0);
    if (rest) fac.push({ label: `อื่น ๆ (${s.by_faculty.length - 7} คณะ/กลุ่ม)`, n: rest, color: GREY });
    pie('cFac', fac);

    const bar = (id, labels, data) => charts.push(new Chart($(id), {
      type: 'bar',
      data: { labels, datasets: [{ data, backgroundColor: '#f2e6e7', hoverBackgroundColor: '#fff', borderRadius: { topLeft: 4, topRight: 4 }, borderSkipped: 'bottom', maxBarThickness: 36 }] },
      options: { maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ` ${fmt(c.parsed.y)} คน` } } },
        scales: { x: { grid: { display: false } }, y: { beginAtZero: true, ticks: { precision: 0 } } } }
    }));
    bar('#cGroup', s.by_group.map(x => x.code), s.by_group.map(x => x.n));
    bar('#cDay', s.by_day.map(d => new Date(d.d).toLocaleDateString('th-TH', { day: 'numeric', month: 'short' })), s.by_day.map(d => d.n));
  }

  // ---------------- people ----------------
  let page = 0, query = '', F = {};
  const PAGE = 50;
  const FILTERS = [
    ['checked', 'สถานะเข้างาน', [['yes', 'เข้างานแล้ว'], ['no', 'ยังไม่เข้า']]],
    ['category', 'ประเภท', Object.entries(CATEGORY)],
    ['group', 'กลุ่ม', GROUPS.map(g => [g, 'Group ' + g])],
    ['faculty', 'คณะ', []],
    ['year', 'ชั้นปี', Object.entries(YEAR)],
    ['gender', 'เพศ', Object.entries(GENDER)],
    ['points', 'Point', [['has', 'มี Point'], ['ge10', '10 ขึ้นไป'], ['zero', '0 Point']]],
    ['invited', 'มาจาก', [['yes', 'ถูกชวน / ใช้โค้ดชวน'], ['eng', 'วิศวะชวน'], ['no', 'สมัครเอง']]],
    ['sort', 'เรียงตาม', [['points', 'Point มากสุด'], ['friends', 'ชวนมากสุด'], ['sid', 'รหัสนิสิต']]]
  ];
  const fLabel = (k, v) => { const d = FILTERS.find(x => x[0] === k); const o = d[2].find(x => x[0] === v); return o ? o[1] : v; };
  async function people() {
    const el = $('#t-people');
    if (!el.dataset.ready) {
      el.dataset.ready = 1;
      if (!FACS) FACS = await api.faculties().catch(() => []);
      FILTERS.find(x => x[0] === 'faculty')[2] = FACS.map(n => [n, n]);
      el.innerHTML = `<div class="stack">
        <div class="row" style="justify-content:space-between"><h2 style="text-shadow:none">รายชื่อ</h2><span class="muted" id="pinfo"></span></div>
        <div class="row nowrap"><form id="search" class="row nowrap" style="flex:1;min-width:0"><input class="input" name="q" placeholder="ค้นหาชื่อ รหัสนิสิต เบอร์ หรือโค้ด" style="flex:1;min-width:0"><button class="btn small">${icon('search', 18)}</button></form>
          <button class="btn ghost small ftoggle" id="ftog">${icon('filter', 17)}ตัวกรอง</button></div>
        <div class="card fpanel closed stack" id="fpanel">
          <div class="fgrid">${FILTERS.map(([k, l, opts]) => `<label>${l}<select data-f="${k}"><option value="">${k === 'sort' ? 'ลงทะเบียนล่าสุด' : 'ทั้งหมด'}</option>${opts.map(([v, t]) => `<option value="${esc(v)}">${esc(t)}</option>`).join('')}</select></label>`).join('')}</div>
          <div class="row" id="fchips"></div>
        </div>
        <div class="card tscroll ptable-wrap" id="ptable" style="padding:6px 12px"></div>
        <div class="pcards" id="pcards"></div>
        <div class="row" style="justify-content:space-between"><button class="btn ghost small" id="prev">← ก่อนหน้า</button><button class="btn ghost small" id="csv">⬇ CSV ตามตัวกรอง</button><button class="btn ghost small" id="next">ถัดไป →</button></div></div>`;
      $('#search').onsubmit = e => { e.preventDefault(); query = e.target.q.value.trim(); page = 0; people(); };
      $('#prev').onclick = () => { if (page > 0) { page--; people(); } };
      $('#next').onclick = () => { page++; people(); };
      $('#csv').onclick = exportCsv;
      $('#ftog').onclick = () => $('#fpanel').classList.toggle('closed');
      $('#fpanel').onchange = e => { const s = e.target.closest('[data-f]'); if (!s) return; if (s.value) F[s.dataset.f] = s.value; else delete F[s.dataset.f]; page = 0; people(); };
      $('#fpanel').onclick = e => {
        const x = e.target.closest('[data-rmf]'); if (x) { delete F[x.dataset.rmf]; page = 0; people(); return; }
        if (e.target.closest('#fclear')) { F = {}; page = 0; people(); }
      };
      el.onclick = e => { const b = e.target.closest('[data-id]'); if (b) personModal(b.dataset.id); };
    }
    // reflect the filters in the selects, the chips and the toggle
    $$('#fpanel [data-f]').forEach(s => { s.value = F[s.dataset.f] || ''; s.classList.toggle('set', !!F[s.dataset.f]); });
    const keys = Object.keys(F).filter(k => k !== 'sort');
    $('#fchips').innerHTML = keys.map(k => `<span class="fchip">${esc(fLabel(k, F[k]))}<button type="button" data-rmf="${k}" aria-label="ลบตัวกรอง">${icon('x', 13, 2.4)}</button></span>`).join('')
      + (Object.keys(F).length ? '<button type="button" class="btn ghost small" id="fclear">ล้างทั้งหมด</button>' : '');
    $('#ftog').innerHTML = icon('filter', 17) + 'ตัวกรอง' + (keys.length ? ` (${keys.length})` : '');
    $('#ptable').innerHTML = '<div class="spinner"></div>'; $('#pcards').innerHTML = '';
    try {
      const rows = await rpc('admin_list', { q: query, lim: PAGE, off: page * PAGE, f: F });
      const total = rows[0] ? Number(rows[0].total_count) : 0;
      $('#pinfo').textContent = total ? `${fmt(total)} คน` : 'ไม่พบ';
      $('#prev').disabled = page === 0; $('#next').disabled = (page + 1) * PAGE >= total;
      $('#ptable').innerHTML = `<table class="t"><thead><tr><th>เข้างาน</th><th>รหัสนิสิต</th><th>ชื่อ</th><th>ปี</th><th>คณะ</th><th>เบอร์</th><th>โค้ดชวน</th><th style="text-align:right">ชวน</th><th style="text-align:right">Point</th><th></th></tr></thead><tbody>
        ${rows.map(r => `<tr>

  async function exportCsv() {
    IMF.toast('กำลังเตรียมไฟล์…');
    const COLS = [['checked_in_at', 'เข้างาน'], ['student_id', 'รหัสนิสิต'], ['first_name', 'ชื่อ'], ['last_name', 'นามสกุล'], ['nickname', 'ชื่อเล่น'], ['gender', 'เพศ'], ['year', 'ชั้นปี'], ['faculty', 'คณะ'],
      ['group_code', 'กลุ่ม'], ['category', 'ประเภท'], ['phone', 'เบอร์'], ['email', 'อีเมล'], ['ref_code', 'โค้ดชวน'], ['used_code', 'โค้ดที่ใช้สมัคร'], ['friends', 'จำนวนชวน'], ['points', 'Point'], ['round', 'รอบ'], ['created_at', 'ลงทะเบียนเมื่อ']];
    try {
      const rows = await rpc('admin_list', { q: query, lim: 20000, off: 0, f: F });
      const cell = v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
      const lines = [COLS.map(c => c[1]).join(',')].concat(rows.map(r => COLS.map(([k]) => {
        let v = r[k];
        if (k === 'category') v = CATEGORY[v];
        if (k === 'gender') v = GENDER[v] || '';
        if (k === 'year') v = v ? YEAR[v] || v : '';
        if ((k === 'created_at' || k === 'checked_in_at') && v) v = new Date(v).toLocaleString('sv-SE', { timeZone: 'Asia/Bangkok' });
        if (k === 'phone' || k === 'student_id') v = v ? '="' + v + '"' : '';   // keep leading zeros in Excel
        return cell(v);
      }).join(',')));
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8' }));
      a.download = 'imf-registrations-' + new Date().toISOString().slice(0, 10) + '.csv'; a.click();
    } catch (e) { IMF.toast(IMF.errMsg(e), true); }
  }

          <div class="rcf"><label>Point<input class="numin" type="number" min="0" data-f="pts" value="${c.points}"></label>
            <label>ใช้ได้<input class="numin" type="number" min="1" data-f="maxu" value="${c.max_uses == null ? '' : c.max_uses}" placeholder="∞"></label>
            <label>เชิญวิศวะ<span class="switch"><input type="checkbox" data-f="unlock" ${c.unlock_eng ? 'checked' : ''}><i></i></span></label>
            <label>เปิดใช้<span class="switch"><input type="checkbox" data-f="act" ${c.active ? 'checked' : ''}><i></i></span></label>
            <span class="rcb"><button class="btn small" data-save>บันทึก</button><button class="btn danger small" data-del aria-label="ลบ ${esc(c.code)}">${icon('trash', 16)}</button></span></div>
        </div>`).join('')}</div>` : '<div class="dim">ยังไม่มี</div>')}
      <div class="hint">แก้ Point ภายหลังไม่กระทบคนที่ใช้ไปแล้ว · โค้ดที่มีคนใช้แล้วลบไม่ได้ ให้ปิด "เปิดใช้" แทน</div>
    </div>`;
    el.onchange = async e => {
      const i = e.target.closest('[data-k]'); if (!i) return;
      try { await api.setSetting(i.dataset.k, i.checked); IMF.toast('บันทึกแล้ว'); } catch (ex) { IMF.toast(IMF.errMsg(ex), true); }
    };
    const num = (v) => v === '' || v == null ? null : parseInt(v, 10);
    $('#addrc').onsubmit = async e => {
      e.preventDefault(); const f = e.target;
      try {
        if (codes.some(c => c.code === f.c.value.trim().toUpperCase())) return IMF.toast('มีโค้ดนี้แล้ว แก้ในรายการด้านล่างได้เลย', true);
        const c = await rpc('admin_redeem_code_save', { c: f.c.value.trim(), pts: num(f.pts.value) || 0, unlock: f.unlock.checked, maxu: num(f.maxu.value), lbl: f.lbl.value.trim() || null, act: true });
        IMF.toast('สร้างโค้ด ' + c); codesTab();
      } catch (ex) { IMF.toast(IMF.errMsg(ex), true); }
    };
    el.onclick = async e => {
      const r = e.target.closest('[data-rc]'); if (!r) return;
      const code = r.dataset.rc, c = codes.find(x => x.code === code), g = k => $(`[data-f="${k}"]`, r);
      try {
        if (e.target.closest('[data-del]')) { if (!confirm('ลบโค้ด ' + code + '?')) return; await rpc('admin_redeem_code_delete', { c: code }); }
        else if (e.target.closest('[data-save]')) await rpc('admin_redeem_code_save', { c: code, pts: num(g('pts').value) || 0, unlock: g('unlock').checked, maxu: num(g('maxu').value), lbl: c.label, act: g('act').checked });
        else return;
        IMF.toast('บันทึกแล้ว'); codesTab();
      } catch (ex) { IMF.toast(IMF.errMsg(ex), true); }
    };
  }

  // ---------------- settings ----------------
  const toLocal = (v) => v ? new Date(v).toLocaleString('sv-SE', { timeZone: 'Asia/Bangkok' }).replace(' ', 'T').slice(0, 16) : '';
  function minibar(s) {
    return `<div class="minibar">${IMF.tabs({ logged_in: true, registered: true }, s).map(([h, ic, l, c]) => c ? `<span class="c"><i>${icon(ic, 16, 2)}</i>${l}</span>` : `<span>${icon(ic, 18)}${l}</span>`).join('')}</div>`;
  }
  async function settingsTab() {
    const el = $('#t-settings');
    let s; try { s = await api.settings(true); } catch (e) { return fail(el, e); }
    el.innerHTML = `<div class="stack"><h2 style="text-shadow:none">ตั้งค่า</h2><div class="acols">
      <div>${sec('users', 'ลงทะเบียน', srow('รอบนิสิตวิศวฯ', toggle('eng_round_open', s.eng_round_open)) + srow('รอบทั่วไป', toggle('general_round_open', s.general_round_open)) + srow('รอบบุคคลภายนอก (Gmail)', toggle('allow_external', s.allow_external)))}
        ${sec('ticket', 'วันงาน', srow('สแกนแลกของรางวัล', toggle('redeem_open', s.redeem_open)) + srow('เป้าหมายจำนวนคน', `<input class="numin" type="number" min="0" data-k="target" value="${esc(s.target)}" style="width:110px">`))}</div>
      <div>${sec('home', 'เปิด / ปิดหน้า', srow('อันดับกลุ่ม', toggle('leaderboard_open', s.leaderboard_open)) + srow('ของรางวัลวิศวะ', toggle('rewards_eng_open', s.rewards_eng_open)) + srow('ของรางวัลส่วนกลาง', toggle('rewards_central_open', s.rewards_central_open))
          + srow('บัตรเข้างาน', toggle('ticket_open', s.ticket_open))
          + srow('นับถอยหลังบัตรถึง', `<input class="input" type="datetime-local" data-k="ticket_countdown_at" value="${toLocal(s.ticket_countdown_at)}" style="width:auto;max-width:210px;color-scheme:dark;padding:8px 10px">`)
          + srow('แผนผังงาน', toggle('map_open', s.map_open)))}</div>
      <div>${sec('gift', 'ของรางวัลวิศวะ · ให้คนนอกเห็นด้วย', srow('คนที่วิศวะชวน', toggle('eng_unlock_referral', s.eng_unlock_referral)) + srow('คนที่ใช้โค้ดเชิญวิศวะ', toggle('eng_unlock_code', s.eng_unlock_code)))}
        ${sec('user', 'แถบเมนูตอนนี้', `<div id="mini" style="margin-top:8px">${minibar(s)}</div>`)}</div>
    </div></div>`;
    el.onchange = async e => {
      const i = e.target.closest('[data-k]'); if (!i) return;
      if (i.type === 'datetime-local' && !i.value) return;
      let v = i.type === 'checkbox' ? i.checked : i.type === 'datetime-local' ? i.value + ':00+07:00' : Math.max(0, parseInt(i.value || '0', 10));
      try { await api.setSetting(i.dataset.k, v); s[i.dataset.k] = v; s.rewards_open = !!(s.rewards_eng_open || s.rewards_central_open); $('#mini').innerHTML = minibar(s); IMF.toast('บันทึกแล้ว'); } catch (ex) { IMF.toast(IMF.errMsg(ex), true); }
    };
  }

  // ---------------- rewards & activities ----------------
  // shrink a picked photo to a small square JPEG so it can be stored with the reward
  function pickImage() {
    return new Promise(resolve => {
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
      inp.onchange = () => {
        const file = inp.files[0]; if (!file) return resolve(null);
        const img = new Image();
        img.onload = () => {
          const S = 480, c = document.createElement('canvas'); c.width = c.height = S;
          const k = Math.max(S / img.width, S / img.height), w = img.width * k, h = img.height * k;
          const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, S, S); ctx.drawImage(img, (S - w) / 2, (S - h) / 2, w, h);
          URL.revokeObjectURL(img.src); resolve(c.toDataURL('image/jpeg', .8));
        };
        img.onerror = () => resolve(null);
        img.src = URL.createObjectURL(file);
      };
      inp.click();
    });
  }
  const images = {};   // row key → data URL chosen but not saved yet
  async function rewardsTab() {
    const el = $('#t-rewards');
    let list, acts; try { [list, acts] = await Promise.all([api.rewards.list(true), api.activities.list(true)]); } catch (e) { return fail(el, e); }
    const rrow = (r) => { const key = r.id || 'new'; images[key] = r.image || null; return `<tr data-id="${r.id || ''}" data-kind="reward">
        <td><div class="thumb" data-pick="${key}" ${r.image ? `style="background-image:url('${esc(r.image)}')"` : ''}>${r.image ? '' : 'เลือกรูป'}</div></td>
        <td><input class="input" name="name" value="${esc(r.name)}" placeholder="${r.id ? '' : '+ ของรางวัลใหม่'}" style="min-width:150px"><input class="input" name="description" value="${esc(r.description || '')}" placeholder="รายละเอียด (ไม่บังคับ)" style="margin-top:6px;font-size:14px;padding:8px 12px"></td>
        <td><select class="input" name="scope" style="width:auto;padding:8px 10px"><option value="all" ${r.scope !== 'eng' ? 'selected' : ''}>ส่วนกลาง</option><option value="eng" ${r.scope === 'eng' ? 'selected' : ''}>เฉพาะวิศวะ</option></select></td>
        <td><input class="input" name="cost" type="number" min="1" value="${r.cost}" style="width:80px"></td>
        <td><input class="input" name="stock" type="number" min="0" value="${r.stock == null ? '' : r.stock}" placeholder="ไม่จำกัด" style="width:100px"></td>
        <td><input class="input" name="sort" type="number" value="${r.sort}" style="width:70px"></td>
        <td><label class="switch"><input type="checkbox" name="repeatable" ${r.repeatable !== false ? 'checked' : ''}><i></i></label></td>
        <td><label class="switch"><input type="checkbox" name="active" ${r.active ? 'checked' : ''}><i></i></label></td>
        <td><button class="btn small">${r.id ? 'บันทึก' : 'เพิ่ม'}</button></td></tr>`; };
    const arow = (a) => `<tr data-id="${a.id || ''}" data-kind="activity">
        <td><input class="input" name="name" value="${esc(a.name)}" placeholder="${a.id ? '' : '+ กิจกรรมใหม่ เช่น ถ่ายรูปที่ Photo booth'}" style="min-width:200px"></td>
        <td><input class="input" name="points" type="number" min="1" value="${a.points}" style="width:80px"></td>
        <td><label class="switch"><input type="checkbox" name="repeatable" ${a.repeatable ? 'checked' : ''}><i></i></label></td>
        <td><label class="switch"><input type="checkbox" name="active" ${a.active ? 'checked' : ''}><i></i></label></td>
        <td><button class="btn small">${a.id ? 'บันทึก' : 'เพิ่ม'}</button></td></tr>`;
    el.innerHTML = `<div class="card tscroll"><div class="card-title"><h3>ของรางวัล</h3><a class="small muted" href="rewards.html" target="_blank">ดูหน้าของรางวัล ↗</a></div>
      <table class="t"><thead><tr><th>รูป</th><th>ชื่อ / รายละเอียด</th><th>สำหรับ</th><th>ใช้ Point</th><th>คงเหลือ</th><th>ลำดับ</th><th>แลกซ้ำได้</th><th>แสดง</th><th></th></tr></thead><tbody>
      ${list.concat([{ id: null, name: '', description: '', cost: 1, stock: null, sort: 0, active: true, image: null, scope: 'all' }]).map(rrow).join('')}</tbody></table>
      <div class="hint">ลบของรางวัลไม่ได้ (เพราะมีประวัติการแลก) ให้ปิดสวิตช์ "แสดง" แทน · รูปจะถูกย่อเป็นสี่เหลี่ยมจัตุรัสอัตโนมัติ</div></div>
      <div class="card tscroll" style="margin-top:14px"><div class="card-title"><h3>กิจกรรมสะสม Point</h3></div>
      <table class="t"><thead><tr><th>กิจกรรม</th><th>ได้ Point</th><th>รับซ้ำได้</th><th>เปิด</th><th></th></tr></thead><tbody>
      ${acts.concat([{ id: null, name: '', points: 1, active: true }]).map(arow).join('')}</tbody></table>
      <div class="hint">ทีมงานให้ Point ในหน้าสแกน · ปิด "รับซ้ำได้" = คนละครั้ง</div></div>`;
    el.onclick = async e => {
      const pick = e.target.closest('[data-pick]');
      if (pick) { const url = await pickImage(); if (url) { images[pick.dataset.pick] = url; pick.style.backgroundImage = `url('${url}')`; pick.textContent = ''; } return; }
      const b = e.target.closest('button'); if (!b) return;
      const tr = b.closest('tr'), g = n => tr.querySelector(`[name="${n}"]`);
      try {
        if (tr.dataset.kind === 'reward') {
          const r = { name: g('name').value.trim(), description: g('description').value.trim() || null, cost: parseInt(g('cost').value, 10), stock: g('stock').value === '' ? null : parseInt(g('stock').value, 10),
            sort: parseInt(g('sort').value || '0', 10), active: g('active').checked, scope: g('scope').value, repeatable: g('repeatable').checked, image: images[tr.dataset.id || 'new'] || null };
          if (!r.name || !(r.cost > 0)) return IMF.toast('กรอกชื่อและ Point ให้ครบ', true);
          if (tr.dataset.id) r.id = Number(tr.dataset.id);
          await api.rewards.save(r);
        } else {
          const a = { name: g('name').value.trim(), points: parseInt(g('points').value, 10), active: g('active').checked, repeatable: g('repeatable').checked };
          if (!a.name || !(a.points > 0)) return IMF.toast('กรอกชื่อกิจกรรมและ Point ให้ครบ', true);
          if (tr.dataset.id) a.id = Number(tr.dataset.id);
          await api.activities.save(a);
        }
        IMF.toast('บันทึกแล้ว'); rewardsTab();
      } catch (ex) { IMF.toast(IMF.errMsg(ex), true); }
    };
  }

  // ---------------- team ----------------
  const ROLE = { owner: 'Owner', admin: 'แอดมิน', staff: 'ทีมงาน' };
  async function teamTab() {
    const el = $('#t-team');
    let staff; try { staff = await api.staffList(); } catch (e) { return fail(el, e); }
    const can = (r) => info.is_owner || r === 'staff';   // admins manage staff only; the owner manages everyone
    const rank = { owner: 0, admin: 1, staff: 2 };
    staff.sort((a, b) => rank[a.role] - rank[b.role]);
    el.innerHTML = `<div class="card stack" style="max-width:680px"><h3>ทีมงาน</h3>
        <div class="hint"><b>Owner</b> ทำได้ทุกอย่าง รวมถึงเพิ่ม/ลบ/เปลี่ยนสิทธิ์แอดมินและทีมงานทุกคน · <b>แอดมิน</b> ใช้หลังบ้านได้ทั้งหมด และจัดการได้เฉพาะทีมงาน · <b>ทีมงาน</b> ใช้หน้าสแกนได้อย่างเดียว<br>คนที่จะเพิ่มต้องเข้าสู่ระบบเว็บนี้อย่างน้อย 1 ครั้งก่อน</div>
        <form id="addst" class="row"><input class="input" name="em" type="email" placeholder="อีเมล" style="flex:1" required>
          <select class="input" name="r" style="width:auto"><option value="staff">ทีมงาน</option>${info.is_owner ? '<option value="admin">แอดมิน</option><option value="owner">Owner</option>' : ''}</select><button class="btn small">เพิ่ม / เปลี่ยนสิทธิ์</button></form>
        <ul class="list">${staff.map(s => `<li><div style="flex:1" class="small">${esc(s.email)}</div><span class="chip ${s.role !== 'staff' ? 'on' : ''}">${ROLE[s.role]}</span>
          ${can(s.role) && s.email !== info.email ? `<button class="btn danger small" data-rm="${s.user_id}">ลบสิทธิ์</button>` : '<span style="width:74px"></span>'}</li>`).join('') || '<li class="dim">ยังไม่มี</li>'}</ul></div>`;
    $('#addst').onsubmit = async e => {
      e.preventDefault(); const f = e.target;
      try { await rpc('admin_add_staff', { em: f.em.value.trim(), r: f.r.value }); IMF.toast('บันทึกแล้ว'); teamTab(); } catch (ex) { IMF.toast(IMF.errMsg(ex), true); }
    };
    el.onclick = async e => {
      const b = e.target.closest('[data-rm]'); if (!b || !confirm('ลบสิทธิ์ของคนนี้?')) return;
      try { await rpc('admin_remove_staff', { uid: b.dataset.rm }); teamTab(); } catch (ex) { IMF.toast(IMF.errMsg(ex), true); }
    };
  }

  overview();
})();
</script>
