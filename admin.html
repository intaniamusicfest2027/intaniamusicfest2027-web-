<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c9363a">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>หลังบ้าน · INTANIA MUSIC FEST</title>
<link rel="icon" href="assets/icon.png">
<link rel="stylesheet" href="assets/style.css?v=80">
<script src="assets/config.js"></script>
<script src="assets/vendor/supabase.js"></script>
<script src="assets/vendor/chart.umd.js"></script>
<script src="assets/app.js?v=80"></script>
<style>
  .chart-box { position: relative; height: 230px; }
  .legend span:nth-child(3n+1) { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 4px 12px; font-size: 13px; color: var(--ink-2); margin-top: 12px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 7px; }
  .legend b { color: #fff; text-align: right; font-variant-numeric: tabular-nums; }
  .legend span:nth-child(3n) { text-align: right; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .pie-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
  .pie-center b { font-size: 34px; line-height: 1; }
  .card { backdrop-filter: none; background: #1c0709; }
  .grid-2 > .card, .grid-4 > .stat { min-width: 0; }
  tr.click { cursor: pointer; } tr.click:hover td { background: rgba(255, 255, 255, .05); }
  .tight3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) !important; gap: 10px; }
  .tight3 .stat .v { font-size: 26px; }
  @media (max-width: 600px) { .amain .grid-2 { grid-template-columns: minmax(0, 1fr) !important; } }
  .h2s { text-shadow: none; margin: 0 2px 10px; font-size: 22px; }
  .atabs button { display: inline-flex; align-items: center; gap: 7px; }
  .atabs button svg { width: 19px; height: 19px; }
  .setting .sl { display: flex; flex-direction: column; min-width: 0; flex: 1; }
  .setting .sl small { color: var(--ink-3); font-size: 12.5px; font-weight: 500; margin-top: 1px; }
  .seg3 { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.16); }
  .seg3 button { flex: 1; min-height: 42px; border: 0; border-radius: 9px; background: none; color: #f0c9cc; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer; padding: 0 8px; }
  .seg3 button.on { background: #fff; color: #8e0a10; }
  .stl { padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); overflow: hidden; }
  .strow { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 52px; padding: 10px 16px; border: 0; border-top: 1px solid rgba(255,255,255,.08); background: none; color: #fff; font: inherit; font-weight: 700; font-size: 15px; text-align: left; cursor: pointer; }
  .strow > span:first-child { flex: 1; }
  .strow svg { color: var(--ink-3); flex: none; }
  .strow:hover { background: rgba(255,255,255,.04); }
  .schip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 800; white-space: nowrap; }
  .schip.on { background: #0b3d22; color: #4be08c; }
  .schip.off { background: rgba(255,255,255,.08); color: #d9b8bb; }
  .schip.mid { background: #4a3300; color: #ffd27a; }
  .vis .lbl { font-size: 13.5px; font-weight: 700; color: #f0c9cc; margin: 10px 0 6px; }
  .vis h3 .engb2, .engsec h3 .engb2 { margin-right: 2px; }
  .subbox { border: 1px solid rgba(255,255,255,.14); border-radius: 12px; background: rgba(0,0,0,.3); padding: 0 14px; }
  .sumbox { display: flex; gap: 10px; align-items: flex-start; margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: rgba(255,194,75,.1); border: 1px solid rgba(255,194,75,.4); color: #ffe2a3; font-size: 13.5px; line-height: 1.5; }
  .sumbox svg { flex: none; margin-top: 1px; }
  .qchips { display: flex; gap: 8px; flex-wrap: wrap; }
  .qchips button { min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.2); background: rgba(0,0,0,.35); color: #f0c9cc; font: inherit; font-weight: 700; font-size: 13.5px; cursor: pointer; }
  .qchips button.on { background: #fff; color: #8e0a10; border-color: #fff; }
  .tagb { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 800; white-space: nowrap; }
  .tagb.eng { background: #d8141c; color: #fff; } .tagb.inv { background: #0b3d22; color: #4be08c; } .tagb.code { background: #4a3300; color: #ffd27a; } .tagb.none { background: rgba(255,255,255,.08); color: #d9b8bb; }
  .pcard2 .tx .bdg { display: block; margin-top: 4px; }
  .engsec { border: 1px solid #e3cfd1; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .engsec h3 { display: flex; align-items: center; gap: 6px; margin: 0; }
  .res { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; }
  .res div { display: flex; flex-direction: column; } .res span { font-size: 13px; }
  .res.ok { background: #e3f6ea; color: #0f6b39; } .res.no { background: #f4eaeb; color: #5c3a3d; }
  .erow { display: flex; align-items: center; gap: 8px; padding-top: 10px; border-top: 1px solid #efe3e4; flex-wrap: wrap; }
  .erow .et { flex: 1; min-width: 180px; display: flex; flex-direction: column; } .erow .et span { font-size: 13px; color: #6b4a4d; }
  .rwgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
  .rwc { display: flex; flex-direction: column; gap: 10px; padding: 14px; }
  .rwtop { display: flex; gap: 12px; align-items: flex-start; }
  .rwn { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .input.sm { font-size: 14px; padding: 8px 12px; }
  .rwf { display: grid; grid-template-columns: minmax(0, 1.3fr) repeat(3, minmax(0, 1fr)); gap: 8px; }
  .ff { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--ink-2); min-width: 0; }
  .ff .input { padding: 8px 10px; min-width: 0; }
  .rwb { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
  .rwb > .btn { margin-left: auto; min-height: 44px; }
  .ff.sw { align-items: flex-start; }
  @media (max-width: 760px) {
    .rwgrid { grid-template-columns: minmax(0, 1fr); }
    .rwf { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .stl { grid-template-columns: minmax(0, 1fr); }
    .ahead .in { flex-wrap: nowrap; }
    .ahead .brandl b { font-size: 17px; }
    .atabs { display: none !important; }
    .amain { padding-bottom: 110px !important; }
    .roleb { margin-left: auto; }
  }
  .abot { display: none; }
  @media (max-width: 760px) {
    .abot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
      background: #0e0102; border-top: 1px solid rgba(255,255,255,.12); padding-bottom: env(safe-area-inset-bottom); }
    .abot button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 64px; border: 0; background: none;
      color: #c09497; font: inherit; font-size: 11.5px; font-weight: 600; cursor: pointer; }
    .abot button.on { color: #ff6a6f; }
  }
  .card.stack > h3 { display: flex; align-items: center; gap: 8px; }
  #addst { flex-wrap: wrap; } #addst [name=em] { flex: 1 1 100%; }
  .osec { display: flex; align-items: center; gap: 8px; margin: 22px 2px 10px; font-size: 19px; }
  .rcl { display: flex; flex-direction: column; }
  .rcr { padding: 12px 0; border-top: 1px solid rgba(255,255,255,.1); display: flex; flex-direction: column; gap: 10px; }
  .rcr:first-child { border-top: 0; }
  .rch { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .rch b { font-size: 17px; letter-spacing: 1px; }
  .engb2 { padding: 2px 9px; border-radius: 999px; background: var(--red); color: #fff; font-size: 11.5px; font-weight: 800; }
  .rcf { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end; }
  .rcf label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--ink-2); }
  .rcf .numin { width: 84px; }
  .rcb { margin-left: auto; display: flex; gap: 6px; }
  .thumb { width: 64px; height: 64px; border-radius: 10px; background: #3a1418 center / cover no-repeat; display: grid; place-items: center; cursor: pointer; font-size: 12px; color: var(--ink-3); text-align: center; flex: none; }
</style>
</head>
<body>
<main class="stage"><div id="root"><div class="spinner" style="margin-top:120px"></div></div></main>

<script>
(async () => {
  const { api, rpc, $, $$, esc, fmt, CATEGORY, YEAR, GENDER, REASON, GROUPS, icon } = IMF;
  const root = $('#root');
  const { info } = await IMF.boot({ admin: true });

  if (!info.logged_in) {
    root.innerHTML = `<div class="inner stack" style="max-width:420px;margin:0 auto"><div class="ph"><h1>หลังบ้าน</h1></div><div id="login" class="stack"></div></div>`;
    IMF.loginButtons($('#login')); return;
  }
  if (!info.is_admin) { root.innerHTML = `<div class="inner"><div class="card" style="margin-top:60px">บัญชี ${esc(info.email)} ไม่ใช่แอดมิน · <a href="index.html">กลับหน้าเว็บ</a></div></div>`; return; }

  // 5 sections; on a phone they become a bottom bar like the main site
  const TABS = [['overview', 'ภาพรวม', 'home'], ['people', 'คน', 'users'], ['rewards', 'ของรางวัล', 'gift'], ['points', 'Point', 'star'], ['settings', 'ตั้งค่า', 'gear']];
  root.innerHTML = `<header class="ahead"><div class="in">
      <a class="backbtn" href="index.html" aria-label="กลับหน้าเว็บ">${icon('back', 22)}</a>
      <span class="brandl"><img src="${IMF.LOGO}" alt="INTANIA MUSIC FEST"><b>หลังบ้าน</b></span>
      <nav class="atabs" id="tabs" aria-label="เมนูหลังบ้าน">${TABS.map(([k, l, ic], i) => `<button data-t="${k}" class="${i ? '' : 'on'}" ${i ? '' : 'aria-current="page"'}>${icon(ic, 22, 1.9)}<span>${l}</span></button>`).join('')}</nav>
      <span class="roleb">${info.is_owner ? 'OWNER' : 'ADMIN'}</span>
    </div></header>
    <div class="amain">
      <section id="s-overview"><div id="t-status"></div><div id="t-overview" style="margin-top:14px"></div></section>
      <section id="s-people" class="hide"><div id="t-people"></div></section>
      <section id="s-rewards" class="hide"><div id="t-vis"></div><div id="t-rewards" style="margin-top:14px"></div></section>
      <section id="s-points" class="hide"><h2 style="text-shadow:none;margin-bottom:10px">Point</h2>
        <div class="seg3" id="psub">${[['referral', 'ชวนเพื่อน'], ['codes', 'Redeem Code'], ['acts', 'กิจกรรม']].map(([k, l], i) => `<button type="button" data-p="${k}" class="${i ? '' : 'on'}">${l}</button>`).join('')}</div>
        <div id="t-referral" style="margin-top:14px"></div><div id="t-codes" class="hide" style="margin-top:14px"></div><div id="t-acts" class="hide" style="margin-top:14px"></div></section>
      <section id="s-settings" class="hide"><div id="t-settings"></div><div id="t-team" style="margin-top:14px"></div></section>
    </div>`;

  // phone: a separate bottom bar straight under <body>, so no header/stacking context can hide it
  const bot = document.createElement('nav');
  bot.className = 'abot'; bot.setAttribute('aria-label', 'เมนูหลังบ้าน');
  bot.innerHTML = TABS.map(([k, l, ic], i) => `<button data-t="${k}" class="${i ? '' : 'on'}" ${i ? '' : 'aria-current="page"'}>${icon(ic, 24, 1.9)}<span>${l}</span></button>`).join('');
  document.body.appendChild(bot);
  let psub = 'referral';
  const subFn = { referral: () => referralTab(), codes: () => codesTab(), acts: () => activitiesTab() };
  const tabFn = { overview: () => { statusStrip(); overview(); }, people, rewards: () => { visTab(); rewardsTab(); }, points: () => subFn[psub](), settings: () => { settingsTab(); teamTab(); } };
  let active = 'overview';
  function go(t, sub) {
    if (sub) { psub = sub; $$('#psub button').forEach(x => x.classList.toggle('on', x.dataset.p === sub)); ['referral', 'codes', 'acts'].forEach(k => $('#t-' + k).classList.toggle('hide', k !== sub)); }
    $$('#tabs button, .abot button').forEach(x => { x.classList.toggle('on', x.dataset.t === t); if (x.dataset.t === t) x.setAttribute('aria-current', 'page'); else x.removeAttribute('aria-current'); });
    $$('.amain > section').forEach(x => x.classList.toggle('hide', x.id !== 's-' + t));
    active = t; window.scrollTo(0, 0); tabFn[t]();
  }
  $('#tabs').onclick = bot.onclick = e => { const b = e.target.closest('button'); if (b) go(b.dataset.t); };
  $('#psub').onclick = e => { const b = e.target.closest('button'); if (b) go('points', b.dataset.p); };

  const fail = (el, e) => { el.innerHTML = `<div class="card">${esc(IMF.errMsg(e))}</div>`; };
  const yearTxt = (y) => y ? (YEAR[y] || y) : '–';
  const toggle = (k, on) => `<label class="switch"><input type="checkbox" data-k="${k}" ${on ? 'checked' : ''}><i></i></label>`;
  const srow = (label, ctrl, desc) => `<div class="setting"><div class="sl"><b>${label}</b>${desc ? `<small>${desc}</small>` : ''}</div>${ctrl}</div>`;
  const seg = (key, cur, opts) => `<div class="seg3" data-seg="${key}">${opts.map(([v, l]) => `<button type="button" data-v="${v}" class="${String(cur) === String(v) ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  const STAT = { on: ['เปิด', 'on'], off: ['ปิด', 'off'], mid: ['', 'mid'] };
  const chipS = (kind, text) => `<span class="schip ${kind}">${text || STAT[kind][0]}</span>`;
  const VIEW = { off: ['ปิด', 'off'], eng: ['เฉพาะวิศวะเห็น', 'mid'], all: ['ทุกคนเห็น', 'on'] };

  // ---------------- what is open right now ----------------
  async function statusStrip() {
    const el = $('#t-status');
    let s; try { s = await api.settings(true); } catch (e) { return fail(el, e); }
    const v = VIEW[s.eng_rewards_view] || VIEW.off;
    const rows = [
      ['ลงทะเบียน · รอบวิศวะ', s.eng_round_open ? 'on' : 'off', '', 'settings'],
      ['ลงทะเบียน · รอบจุฬาฯ', s.general_round_open ? 'on' : 'off', '', 'settings'],
      ['ลงทะเบียน · บุคคลภายนอก', s.allow_external && s.general_round_open ? 'on' : 'off', '', 'settings'],
      ['ของรางวัล Exclusive วิศวะ', v[1], v[0], 'rewards'],
      ['ของรางวัลทั่วไป', s.rewards_central_open ? 'on' : 'off', '', 'rewards'],
      ['จุดแลกของรางวัล', s.redeem_open ? 'on' : 'off', '', 'rewards'],
      ['ชวนเพื่อน', s.referral_open ? 'on' : 'off', '', 'points', 'referral'],
      ['Redeem Code', s.codes_open ? 'on' : 'off', '', 'points', 'codes'],
      ['อันดับกลุ่ม', s.leaderboard_open ? 'on' : 'off', '', 'settings'],
      ['บัตรเข้างาน / QR', s.ticket_open ? 'on' : 'off', '', 'settings'],
      ['แผนผังงาน', s.map_open ? 'on' : 'off', '', 'settings']
    ];
    el.innerHTML = `<h2 class="h2s">เปิดอะไรอยู่ตอนนี้</h2><div class="card stl">${rows.map(([l, k, t, tab, sub]) =>
      `<button type="button" class="strow" data-go="${tab}" data-sub="${sub || ''}"><span>${l}</span>${chipS(k, t)}${icon('chev', 18)}</button>`).join('')}</div>`;
    el.onclick = e => { const b = e.target.closest('[data-go]'); if (b) go(b.dataset.go, b.dataset.sub || null); };
  }

  // ---------------- rewards: who sees / who can redeem ----------------
  async function visTab() {
    const el = $('#t-vis');
    let s; try { s = await api.settings(true); } catch (e) { return fail(el, e); }
    const view = s.eng_rewards_view || 'off';
    const ways = [s.eng_unlock_referral ? 'คนที่วิศวะชวน' : '', s.eng_unlock_code ? 'คนที่ใช้โค้ดวิศวะ' : ''].filter(Boolean);
    const summary = view === 'off' ? 'ไม่มีใครเห็นของรางวัลวิศวะ'
      : view === 'eng' ? 'เห็นและแลกได้เฉพาะนิสิตวิศวะ · คนอื่นมองไม่เห็น'
      : 'ทุกคนเห็น · แลกได้: นิสิตวิศวะ' + (ways.length ? ' และ' + ways.join(' และ') : '') + ' · คนอื่นเห็นแต่กดแลกไม่ได้';
    el.innerHTML = `<h2 class="h2s">ของรางวัล</h2><div class="acols">
      <div class="card sec vis"><h3><span class="engb2">ENG</span>Exclusive วิศวะ</h3>
        <div class="lbl">ใครเห็น</div>${seg('eng_rewards_view', view, [['off', 'ปิด'], ['eng', 'เฉพาะวิศวะ'], ['all', 'ทุกคน']])}
        ${view === 'all' ? `<div class="lbl">ใครแลกได้</div><div class="subbox">
          ${srow('นิสิตวิศวะ', '<span class="schip off">' + icon('lock', 13, 2.4) + 'ได้เสมอ</span>')}
          ${srow('คนที่วิศวะชวน', toggle('eng_unlock_referral', s.eng_unlock_referral))}
          ${srow('คนที่ใช้โค้ดวิศวะ', toggle('eng_unlock_code', s.eng_unlock_code), 'สร้างโค้ดได้ที่ Point → Redeem Code')}</div>` : ''}
        <div class="sumbox">${icon('eye', 18)}<span>${summary}</span></div></div>
      <div>
        <div class="card sec vis"><h3>ของรางวัลทั่วไป</h3><div class="lbl">ใครเห็น</div>${seg('rewards_central_open', !!s.rewards_central_open, [[false, 'ปิด'], [true, 'เปิดให้ทุกคน']])}</div>
        <div class="card sec" style="margin-top:14px">${srow('เปิดจุดแลก (วันงาน)', toggle('redeem_open', s.redeem_open), 'Staff สแกน QR แลกของได้')}</div>
      </div></div>`;
    el.onclick = async e => {
      const b = e.target.closest('[data-seg] button'); if (!b) return;
      const k = b.closest('[data-seg]').dataset.seg, v = b.dataset.v === 'true' ? true : b.dataset.v === 'false' ? false : b.dataset.v;
      try { await api.setSetting(k, v); IMF.toast('บันทึกแล้ว'); visTab(); } catch (ex) { IMF.toast(IMF.errMsg(ex), true); }
    };
    el.onchange = async e => {
      const i = e.target.closest('[data-k]'); if (!i) return;
      try { await api.setSetting(i.dataset.k, i.checked); IMF.toast('บันทึกแล้ว'); visTab(); } catch (ex) { IMF.toast(IMF.errMsg(ex), true); }
    };
  }
  const sec = (ic, title, body) => `<div class="card sec"><h3>${icon(ic, 19)}${title}</h3>${body}</div>`;

  // ---------------- overview ----------------
  Chart.defaults.color = '#f0c9cc';
  Chart.defaults.borderColor = 'rgba(255,255,255,.12)';
  Chart.defaults.font.family = "'Noto Sans Thai', system-ui, sans-serif";
  const PAL = ['#3987e5', '#d95926', '#199e70', '#c98500', '#d55181', '#0ca30c', '#9085e9', '#e66767'];
  const GREY = '#8f8083', SURFACE = '#1c0709';
  let charts = [];

  // items: [{label, n, color?}] → pie + legend with counts and %
  function pie(id, items) {
    const total = items.reduce((a, x) => a + x.n, 0) || 1;
    items.forEach((x, i) => { if (!x.color) x.color = PAL[i % PAL.length]; });
    charts.push(new Chart($('#' + id), {
      type: 'pie',
      data: { labels: items.map(x => x.label), datasets: [{ data: items.map(x => x.n), backgroundColor: items.map(x => x.color), borderColor: SURFACE, borderWidth: 2 }] },
      options: { maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ` ${c.label}: ${fmt(c.parsed)} คน (${(c.parsed / total * 100).toFixed(1)}%)` } } } }
    }));
    $('#' + id + 'L').innerHTML = items.map(x => `<span><i style="background:${x.color}"></i>${esc(x.label)}</span><b>${fmt(x.n)}</b><span>${(x.n / total * 100).toFixed(1)}%</span>`).join('');
  }
  const pieCard = (title, id) => `<div class="card"><div class="card-title"><h3>${title}</h3></div><div class="chart-box"><canvas id="${id}"></canvas></div><div class="legend" id="${id}L"></div></div>`;

  async function overview() {
    const el = $('#t-overview');
    el.innerHTML = '<div class="spinner"></div>';
    let s;
    try { s = await rpc('admin_stats'); } catch (e) { return fail(el, e); }
    charts.forEach(c => c.destroy()); charts = [];
    const pct = s.target ? Math.min(100, s.total / s.target * 100) : 0;

    el.innerHTML = `
      <div class="grid-4">
        <div class="stat"><div class="v">${fmt(s.total)}</div><div class="l">ลงทะเบียนทั้งหมด</div></div>

      <div class="grid-4">
        <div class="stat"><div class="v">${fmt(s.referred)}</div><div class="l">ถูกเพื่อนชวน (${s.total ? Math.round(s.referred / s.total * 100) : 0}%)</div></div>
        <div class="stat"><div class="v">${fmt(s.inviters)}</div><div class="l">คนที่ชวนเพื่อน</div></div>
        <div class="stat"><div class="v">${fmt(s.eng_unlocked)}</div><div class="l">คนนอกที่เห็นของวิศวะ</div></div>
        <div class="stat"><div class="v">${fmt(s.codes_used)}</div><div class="l">ใช้ Redeem Code</div></div>

      <div class="grid-2" style="margin-top:14px">
        ${pieCard('มาจากไหน', 'cSrc')}

      </div>
      <div class="card" style="margin-top:14px"><div class="card-title"><h3>ชวนมากสุด</h3></div>
        ${s.top_inviters.length ? `<ul class="list">${s.top_inviters.map((t, i) => `<li><span class="dim" style="width:22px;text-align:center;font-weight:800">${i + 1}</span><div style="flex:1;min-width:0"><b>${esc(t.name)}</b><div class="small muted">${esc(CATEGORY[t.cat] || '')}${t.grp ? ' · Group ' + esc(t.grp) : ''}</div></div><b>${fmt(t.n)}</b><span class="small dim">คน</span></li>`).join('')}</ul>` : '<div class="dim">ยังไม่มี</div>'}</div>
      <div class="card" style="margin-top:14px"><div class="card-title"><h3>จำนวนคนแยกกรุ๊ป (นิสิตวิศวะ)</h3></div><div class="chart-box"><canvas id="cGroup"></canvas></div></div>
      <div class="card" style="margin-top:14px"><div class="card-title"><h3>ลงทะเบียนรายวัน</h3></div><div class="chart-box"><canvas id="cDay"></canvas></div></div>
      <div class="card" style="margin-top:14px"><div class="card-title"><h3>ของรางวัลที่แลกไป</h3></div>
        ${s.by_reward.length ? `<table class="t"><thead><tr><th>ของรางวัล</th><th style="text-align:right">แลกไป</th><th style="text-align:right">คงเหลือ</th></tr></thead><tbody>
          ${s.by_reward.map(r => `<tr><td>${esc(r.name)}</td><td style="text-align:right">${fmt(r.n)}</td><td style="text-align:right">${r.stock == null ? '∞' : fmt(r.stock)}</td></tr>`).join('')}</tbody></table>`
        : '<div class="dim">ยังไม่มีการแลก</div>'}</div>`;

    charts.push(new Chart($('#cTarget'), {
      type: 'doughnut',
      data: { labels: ['ลงทะเบียนแล้ว', 'ยังขาด'], datasets: [{ data: [s.total, Math.max(0, s.target - s.total)], backgroundColor: ['#ffffff', '#4a2a2d'], borderColor: SURFACE, borderWidth: 2 }] },
      options: { maintainAspectRatio: false, cutout: '72%', plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ` ${c.label} ${fmt(c.parsed)} คน` } } } }
    }));

    const g = s.by_gender;
    pie('cGender', [['male', 'ชาย'], ['female', 'หญิง'], ['other', 'LGBTQ+'], ['na', 'ไม่ระบุ']].map(([k, l]) => ({ label: l, n: g[k] || 0 }))
      .concat(g['-'] ? [{ label: 'ไม่มีข้อมูล', n: g['-'], color: GREY }] : []));
    const GKEYS = [['male', 'ชาย'], ['female', 'หญิง'], ['other', 'LGBTQ+'], ['na', 'ไม่ระบุ']];
    // gender inside each category: one stacked bar per category, genders in a fixed colour order
    const cats = Object.keys(CATEGORY).filter(c => s.gender_by_cat[c]);
    const gsets = GKEYS.concat(cats.some(c => s.gender_by_cat[c]['-']) ? [['-', 'ไม่มีข้อมูล']] : []).map(([k, l], i) => ({
      label: l, data: cats.map(c => s.gender_by_cat[c][k] || 0), backgroundColor: k === '-' ? GREY : PAL[i], borderColor: SURFACE, borderWidth: { top: 2 }, borderSkipped: false, maxBarThickness: 56 }));
    charts.push(new Chart($('#cGenCat'), {
      type: 'bar', data: { labels: cats.map(c => CATEGORY[c]), datasets: gsets },
      options: { maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ` ${c.dataset.label}: ${fmt(c.parsed.y)} คน` } } },
        scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, beginAtZero: true, ticks: { precision: 0 } } } }
    }));
    $('#cGenCatL').innerHTML = gsets.map(d => { const n = d.data.reduce((a, x) => a + x, 0); return `<span><i style="background:${d.backgroundColor}"></i>${esc(d.label)}</span><b>${fmt(n)}</b><span>${s.total ? (n / s.total * 100).toFixed(1) : 0}%</span>`; }).join('');
    const src = s.by_source;
    pie('cSrc', [{ label: 'สมัครเอง', n: src.none, color: GREY }, { label: 'วิศวะชวน', n: src.eng }, { label: 'คนอื่นชวน', n: src.other }, { label: 'โค้ดพิเศษ', n: src.special }, { label: 'Redeem Code', n: src.code }]);
    const ig = s.invited_gender;
    pie('cInvG', GKEYS.map(([k, l]) => ({ label: l, n: ig[k] || 0 })).concat(ig['-'] ? [{ label: 'ไม่มีข้อมูล', n: ig['-'], color: GREY }] : []));
    const y = s.by_year;
    pie('cYear', ['1', '2', '3', '4', '5+'].map(k => ({ label: YEAR[k], n: y[k] || 0 }))
      .concat(y['-'] ? [{ label: 'ไม่ใช่นิสิต / ไม่ทราบ', n: y['-'], color: GREY }] : []));
    // top 7 faculties + everything else in one grey slice
    const fac = s.by_faculty.slice(0, 7).map(f => ({ label: f.name, n: f.n }));
    const rest = s.by_faculty.slice(7).reduce((a, f) => a + f.n, 0);
    if (rest) fac.push({ label: `อื่น ๆ (${s.by_faculty.length - 7} คณะ/กลุ่ม)`, n: rest, color: GREY });
    pie('cFac', fac);

    const bar = (id, labels, data) => charts.push(new Chart($(id), {
      type: 'bar',

  // ---------------- people ----------------
  let page = 0, query = '', F = {};
  const PAGE = 50;

    ['faculty', 'คณะ', []],
    ['year', 'ชั้นปี', Object.entries(YEAR)],
    ['gender', 'เพศ', Object.entries(GENDER)],
    ['points', 'Point', [['has', 'มี Point'], ['ge10', '10 ขึ้นไป'], ['zero', '0 Point']]],
    ['invited', 'มาจาก', [['yes', 'ถูกชวน / ใช้โค้ดชวน'], ['eng', 'วิศวะชวน'], ['no', 'สมัครเอง']]],
    ['eng', 'สิทธิ์ของวิศวะ', [['eng', 'นิสิตวิศวะ'], ['inv', 'วิศวะชวน'], ['code', 'โค้ดวิศวะ'], ['none', 'ไม่มีสิทธิ์']]],
    ['sort', 'เรียงตาม', [['points', 'Point มากสุด'], ['friends', 'ชวนมากสุด'], ['sid', 'รหัสนิสิต']]]
  ];
  const fLabel = (k, v) => { const d = FILTERS.find(x => x[0] === k); const o = d[2].find(x => x[0] === v); return o ? o[1] : v; };
  async function people() {
    const el = $('#t-people');
    if (!el.dataset.ready) {
      el.dataset.ready = 1;
      if (!FACS) FACS = await api.faculties().catch(() => []);
      FILTERS.find(x => x[0] === 'faculty')[2] = FACS.map(n => [n, n]);
      el.innerHTML = `<div class="stack">
        <div class="row" style="justify-content:space-between"><h2 style="text-shadow:none">รายชื่อ</h2><span class="muted" id="pinfo"></span></div>
        <div class="row nowrap"><form id="search" class="row nowrap" style="flex:1;min-width:0"><input class="input" name="q" placeholder="ค้นหาชื่อ รหัสนิสิต เบอร์ หรือโค้ด" style="flex:1;min-width:0"><button class="btn small">${icon('search', 18)}</button></form>
          <button class="btn ghost small ftoggle" id="ftog">${icon('filter', 17)}ตัวกรอง</button></div>
        <div class="qchips" id="qchips">${[['', 'ทั้งหมด'], ['eng', 'ENG'], ['inv', 'วิศวะชวน'], ['code', 'โค้ดวิศวะ'], ['none', 'ไม่มีสิทธิ์ ENG']].map(([v, l]) => `<button type="button" data-q="${v}">${l}</button>`).join('')}</div>
        <div class="card fpanel closed stack" id="fpanel">
          <div class="fgrid">${FILTERS.map(([k, l, opts]) => `<label>${l}<select data-f="${k}"><option value="">${k === 'sort' ? 'ลงทะเบียนล่าสุด' : 'ทั้งหมด'}</option>${opts.map(([v, t]) => `<option value="${esc(v)}">${esc(t)}</option>`).join('')}</select></label>`).join('')}</div>
          <div class="row" id="fchips"></div>
        </div>
        <div class="card tscroll ptable-wrap" id="ptable" style="padding:6px 12px"></div>
        <div class="pcards" id="pcards"></div>
        <div class="row" style="justify-content:space-between"><button class="btn ghost small" id="prev">← ก่อนหน้า</button><button class="btn ghost small" id="csv">⬇ CSV ตามตัวกรอง</button><button class="btn ghost small" id="next">ถัดไป →</button></div></div>`;
      $('#search').onsubmit = e => { e.preventDefault(); query = e.target.q.value.trim(); page = 0; people(); };
      $('#prev').onclick = () => { if (page > 0) { page--; people(); } };
      $('#next').onclick = () => { page++; people(); };
      $('#csv').onclick = exportCsv;
      $('#ftog').onclick = () => $('#fpanel').classList.toggle('closed');
      $('#qchips').onclick = e => { const b = e.target.closest('[data-q]'); if (!b) return; if (b.dataset.q) F.eng = b.dataset.q; else delete F.eng; page = 0; people(); };
      $('#fpanel').onchange = e => { const s = e.target.closest('[data-f]'); if (!s) return; if (s.value) F[s.dataset.f] = s.value; else delete F[s.dataset.f]; page = 0; people(); };
      $('#fpanel').onclick = e => {
        const x = e.target.closest('[data-rmf]'); if (x) { delete F[x.dataset.rmf]; page = 0; people(); return; }
        if (e.target.closest('#fclear')) { F = {}; page = 0; people(); }
      };
      el.onclick = e => { const b = e.target.closest('[data-id]'); if (b) personModal(b.dataset.id); };
    }
    $$('#qchips button').forEach(b => b.classList.toggle('on', (F.eng || '') === b.dataset.q));
    // reflect the filters in the selects, the chips and the toggle
    $$('#fpanel [data-f]').forEach(s => { s.value = F[s.dataset.f] || ''; s.classList.toggle('set', !!F[s.dataset.f]); });
    const keys = Object.keys(F).filter(k => k !== 'sort');
    $('#fchips').innerHTML = keys.map(k => `<span class="fchip">${esc(fLabel(k, F[k]))}<button type="button" data-rmf="${k}" aria-label="ลบตัวกรอง">${icon('x', 13, 2.4)}</button></span>`).join('')
      + (Object.keys(F).length ? '<button type="button" class="btn ghost small" id="fclear">ล้างทั้งหมด</button>' : '');
    $('#ftog').innerHTML = icon('filter', 17) + 'ตัวกรอง' + (keys.length ? ` (${keys.length})` : '');
    $('#ptable').innerHTML = '<div class="spinner"></div>'; $('#pcards').innerHTML = '';
    try {
      const rows = await rpc('admin_list', { q: query, lim: PAGE, off: page * PAGE, f: F });
      const total = rows[0] ? Number(rows[0].total_count) : 0;
      $('#pinfo').textContent = total ? `${fmt(total)} คน` : 'ไม่พบ';
      $('#prev').disabled = page === 0; $('#next').disabled = (page + 1) * PAGE >= total;

    } catch (e) { fail($('#ptable'), e); }
  }

  const engBadge = (r) => r.category === 'eng' ? '<span class="tagb eng">ENG</span>' : r.inv_eng ? '<span class="tagb inv">วิศวะชวน</span>'
    : r.eng_code ? '<span class="tagb code">โค้ดวิศวะ</span>' : '<span class="tagb none">ไม่มีสิทธิ์ ENG</span>';
  async function personModal(uid) {
    let d, st;
    try { [d, st] = await Promise.all([rpc('admin_person', { uid }), api.settings(true)]); } catch (e) { return IMF.toast(IMF.errMsg(e), true); }
    const p = d.profile, ref = d.referrer, ecodes = d.eng_codes || [];
    const isEngP = p.category === 'eng', invEng = !!(ref && ref.category === 'eng'), hasCode = ecodes.length > 0;
    const view = st.eng_rewards_view || 'off';
    const why = [invEng && st.eng_unlock_referral ? 'ถูกวิศวะชวน' : '', hasCode && st.eng_unlock_code ? 'ใช้โค้ดวิศวะ' : ''].filter(Boolean);
    const canNow = isEngP || (view === 'all' && why.length > 0);
    const resBox = isEngP ? `<div class="res ok">${icon('check', 20, 2.8)}<div><b>นิสิตวิศวะ</b><span>แลกของรางวัลวิศวะได้เสมอ</span></div></div>`
      : canNow ? `<div class="res ok">${icon('check', 20, 2.8)}<div><b>แลกได้</b><span>${why.join(' และ')}</span></div></div>`
      : `<div class="res no">${icon('lock', 18, 2.2)}<div><b>แลกไม่ได้</b><span>${view === 'off' ? 'ของรางวัลวิศวะปิดอยู่' : view === 'eng' ? 'ตอนนี้ตั้งเป็น "เฉพาะวิศวะ"' : (invEng || hasCode) ? 'ช่องทางที่ใช้ยังไม่ได้เปิดในหน้าของรางวัล' : 'ไม่ได้ถูกวิศวะชวน และยังไม่ได้ใช้โค้ดวิศวะ'}</span></div></div>`;
    const engSec = `<div class="engsec"><h3><span class="engb2">ENG</span>สิทธิ์แลกของรางวัลวิศวะ</h3>${resBox}
      <div class="erow"><div class="et"><b>ถูกเชิญโดย</b><span>${ref ? `${esc(ref.name)} · ${esc(CATEGORY[ref.category] || '')}${ref.group_code ? ' · Group ' + esc(ref.group_code) : ''} · ${esc(ref.ref_code)}` : 'ไม่มี'}</span></div>
        <button class="btn ghost small" id="setRef">${icon('edit', 15)}${ref ? 'เปลี่ยน' : 'ใส่'}</button>${ref ? '<button class="btn ghost small" id="clrRef">ลบ</button>' : ''}</div>
      <div class="erow"><div class="et"><b>Redeem Code วิศวะ</b><span>${hasCode ? ecodes.map(c => esc(c.code) + ' · ' + IMF.dateTH(c.at)).join(', ') : 'ยังไม่ได้ใช้'}</span></div>
        ${hasCode ? '<button class="btn ghost small" id="clrCode">ลบ</button>' : '<button class="btn ghost small" id="setCode">' + icon('plus', 15, 2.4) + 'ใส่</button>'}</div>
      <div class="hint" style="color:#6b4a4d">แก้แล้วมีผลทันที · Point ที่ได้ไปแล้วไม่เปลี่ยน</div></div>`;
    const row = (k, v) => `<div><small>${k}</small><b>${esc(v == null || v === '' ? '–' : v)}</b></div>`;
    const m = IMF.modal(`<div class="stack">
      <div class="row" style="justify-content:space-between;align-items:flex-start"><div><h2>${esc(p.first_name)} ${esc(p.last_name)}</h2><div class="muted">${esc(p.nickname || '')}</div></div><div class="row"><button class="btn ghost small" id="edit">✎ แก้ไขข้อมูล</button><button class="btn ghost small" data-close>ปิด</button></div></div>
      <div class="kv">
        ${row('รหัสนิสิต', p.student_id)}${row('ประเภท', CATEGORY[p.category])}
        ${row('คณะ (จากรหัสนิสิต)', p.faculty)}${row('ชั้นปี (จากรหัสนิสิต)', yearTxt(p.year))}
        ${row('กรุ๊ป', p.group_code)}${row('เพศ', GENDER[p.gender])}
        ${row('เบอร์โทร', p.phone)}${row('รอบที่ลงทะเบียน', p.round === 'eng_early' ? 'รอบนิสิตวิศวะ' : 'รอบทั่วไป')}
        <div class="full"><small>อีเมล</small><b>${esc(p.email)}</b></div>
        ${row('ลงทะเบียนเมื่อ', IMF.dateTH(p.created_at))}${row('เข้างาน', p.checked_in_at ? '✓ ' + IMF.dateTH(p.checked_in_at) : 'ยังไม่เข้า')}
        ${row('รหัสชวนของตัวเอง', p.ref_code)}${row('ถูกชวนโดย', d.referrer ? d.referrer.name + ' (' + d.referrer.ref_code + ')' : null)}
        ${row('Redeem Code ที่ใช้', (d.codes || []).join(', '))}
      </div>

  async function exportCsv() {
    IMF.toast('กำลังเตรียมไฟล์…');
    const COLS = [['checked_in_at', 'เข้างาน'], ['student_id', 'รหัสนิสิต'], ['first_name', 'ชื่อ'], ['last_name', 'นามสกุล'], ['nickname', 'ชื่อเล่น'], ['gender', 'เพศ'], ['year', 'ชั้นปี'], ['faculty', 'คณะ'],
      ['group_code', 'กลุ่ม'], ['category', 'ประเภท'], ['phone', 'เบอร์'], ['email', 'อีเมล'], ['ref_code', 'โค้ดชวน'], ['used_code', 'โค้ดที่ใช้สมัคร'], ['friends', 'จำนวนชวน'], ['points', 'Point'], ['round', 'รอบ'], ['created_at', 'ลงทะเบียนเมื่อ']];
    try {
      const rows = await rpc('admin_list', { q: query, lim: 20000, off: 0, f: F });
      const cell = v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
      const lines = [COLS.map(c => c[1]).join(',')].concat(rows.map(r => COLS.map(([k]) => {
        let v = r[k];
        if (k === 'category') v = CATEGORY[v];
        if (k === 'gender') v = GENDER[v] || '';
        if (k === 'year') v = v ? YEAR[v] || v : '';
        if ((k === 'created_at' || k === 'checked_in_at') && v) v = new Date(v).toLocaleString('sv-SE', { timeZone: 'Asia/Bangkok' });
        if (k === 'phone' || k === 'student_id') v = v ? '="' + v + '"' : '';   // keep leading zeros in Excel
        return cell(v);
      }).join(',')));
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8' }));
      a.download = 'imf-registrations-' + new Date().toISOString().slice(0, 10) + '.csv'; a.click();
    } catch (e) { IMF.toast(IMF.errMsg(e), true); }
  }

        IMF.toast('บันทึกแล้ว'); codesTab();
      } catch (ex) { IMF.toast(IMF.errMsg(ex), true); }
    };
  }

  // ---------------- settings ----------------
  const toLocal = (v) => v ? new Date(v).toLocaleString('sv-SE', { timeZone: 'Asia/Bangkok' }).replace(' ', 'T').slice(0, 16) : '';
  function minibar(s) {
    return `<div class="minibar">${IMF.tabs({ logged_in: true, registered: true }, s).map(([h, ic, l, c]) => c ? `<span class="c"><i>${icon(ic, 16, 2)}</i>${l}</span>` : `<span>${icon(ic, 18)}${l}</span>`).join('')}</div>`;
  }
  async function settingsTab() {
    const el = $('#t-settings');
    let s; try { s = await api.settings(true); } catch (e) { return fail(el, e); }
    el.innerHTML = `<h2 class="h2s">ตั้งค่า</h2><div class="acols">
      <div>${sec('users', 'ลงทะเบียน', srow('รอบวิศวะ (Early Bird)', toggle('eng_round_open', s.eng_round_open), 'เฉพาะ @student.chula.ac.th รหัสลงท้าย 21')
          + srow('รอบจุฬาฯ', toggle('general_round_open', s.general_round_open), 'นิสิตและบุคลากรจุฬาฯ ทุกคณะ')
          + srow('รอบบุคคลภายนอก', toggle('allow_external', s.allow_external), 'เข้าด้วย Gmail ได้ (ใช้ได้เมื่อเปิดรอบจุฬาฯ)'))}
        ${sec('home', 'หน้าเว็บ', srow('อันดับกลุ่ม', toggle('leaderboard_open', s.leaderboard_open), 'แสดงในแถบเมนูแทนของรางวัล')
          + srow('บัตรเข้างาน / QR', toggle('ticket_open', s.ticket_open), 'ปิด = แสดงนับถอยหลัง')
          + srow('นับถอยหลังถึง', `<input class="input" type="datetime-local" data-k="ticket_countdown_at" value="${toLocal(s.ticket_countdown_at)}" style="width:auto;max-width:210px;color-scheme:dark;padding:8px 10px">`)
          + srow('แผนผังงาน', toggle('map_open', s.map_open), 'เปิดช่วงใกล้วันงาน'))}</div>
      <div>${sec('gift', 'ของรางวัลและ Point', `<button type="button" class="strow" data-go="rewards"><span>ใครเห็น / ใครแลกได้</span>${icon('chev', 18)}</button><button type="button" class="strow" data-go="points"><span>ชวนเพื่อน · Redeem Code · กิจกรรม</span>${icon('chev', 18)}</button>`)}
        ${sec('trophy', 'อื่น ๆ', srow('เป้าหมายจำนวนคน', `<input class="numin" type="number" min="0" data-k="target" value="${esc(s.target)}" style="width:110px">`))}
        ${sec('user', 'แถบเมนูที่ผู้ใช้เห็นตอนนี้', `<div id="mini" style="margin-top:8px">${minibar(s)}</div><small class="muted" style="margin-top:8px">เปลี่ยนตามสวิตช์อันดับกลุ่ม / แผนผังงาน</small>`)}</div>
    </div>`;
    el.onclick = e => { const b = e.target.closest('[data-go]'); if (b) go(b.dataset.go); };
    el.onchange = async e => {
      const i = e.target.closest('[data-k]'); if (!i) return;
      if (i.type === 'datetime-local' && !i.value) return;
      let v = i.type === 'checkbox' ? i.checked : i.type === 'datetime-local' ? i.value + ':00+07:00' : Math.max(0, parseInt(i.value || '0', 10));
      try { await api.setSetting(i.dataset.k, v); s[i.dataset.k] = v; $('#mini').innerHTML = minibar(s); IMF.toast('บันทึกแล้ว'); } catch (ex) { IMF.toast(IMF.errMsg(ex), true); }
    };
  }

  // ---------------- rewards & activities ----------------
  // shrink a picked photo to a small square JPEG so it can be stored with the reward
  function pickImage() {
    return new Promise(resolve => {
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
      inp.onchange = () => {
        const file = inp.files[0]; if (!file) return resolve(null);
        const img = new Image();
        img.onload = () => {
          const S = 480, c = document.createElement('canvas'); c.width = c.height = S;
          const k = Math.max(S / img.width, S / img.height), w = img.width * k, h = img.height * k;
          const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, S, S); ctx.drawImage(img, (S - w) / 2, (S - h) / 2, w, h);
          URL.revokeObjectURL(img.src); resolve(c.toDataURL('image/jpeg', .8));
        };
        img.onerror = () => resolve(null);
        img.src = URL.createObjectURL(file);
      };
      inp.click();
    });
  }
  const images = {};   // row key → data URL chosen but not saved yet
  const ff = (label, html) => `<label class="ff"><span>${label}</span>${html}</label>`;
  const swf = (label, name, on) => `<label class="ff sw"><span>${label}</span><span class="switch"><input type="checkbox" name="${name}" ${on ? 'checked' : ''}><i></i></span></label>`;
  async function rewardsTab() {
    const el = $('#t-rewards');
    let list; try { list = await api.rewards.list(true); } catch (e) { return fail(el, e); }
    const card = (r) => { const key = r.id || 'new'; images[key] = r.image || null; return `<div class="card rwc" data-id="${r.id || ''}" data-kind="reward">
        <div class="rwtop"><div class="thumb" data-pick="${key}" ${r.image ? `style="background-image:url('${esc(r.image)}')"` : ''}>${r.image ? '' : 'เลือกรูป'}</div>
          <div class="rwn"><input class="input" name="name" value="${esc(r.name)}" placeholder="${r.id ? 'ชื่อ' : '+ ของรางวัลใหม่'}" aria-label="ชื่อของรางวัล">
            <input class="input sm" name="description" value="${esc(r.description || '')}" placeholder="รายละเอียด (ไม่บังคับ)" aria-label="รายละเอียด"></div>
          ${r.scope === 'eng' ? '<span class="engb2">ENG</span>' : ''}</div>
        <div class="rwf">${ff('สำหรับ', `<select class="input" name="scope"><option value="all" ${r.scope !== 'eng' ? 'selected' : ''}>ทั่วไป</option><option value="eng" ${r.scope === 'eng' ? 'selected' : ''}>ENG</option></select>`)}
          ${ff('ใช้ Point', `<input class="input" name="cost" type="number" min="1" value="${r.cost}">`)}
          ${ff('คงเหลือ', `<input class="input" name="stock" type="number" min="0" value="${r.stock == null ? '' : r.stock}" placeholder="ไม่จำกัด">`)}
          ${ff('ลำดับ', `<input class="input" name="sort" type="number" value="${r.sort}">`)}</div>
        <div class="rwb">${swf('แลกซ้ำได้', 'repeatable', r.repeatable !== false)}${swf('แสดง', 'active', r.active)}<button class="btn small ${r.id ? '' : 'red'}">${r.id ? 'บันทึก' : 'เพิ่ม'}</button></div></div>`; };
    const filt = el.dataset.f || 'all';
    const shown = list.filter(r => filt === 'all' || (filt === 'eng' ? r.scope === 'eng' : r.scope !== 'eng'));
    el.innerHTML = `<div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="text-shadow:none">รายการ</h2><a class="small muted" href="rewards.html" target="_blank">ดูหน้าผู้ใช้ ↗</a></div>
      <div class="seg3" id="rfilt" style="margin-bottom:12px">${[['all', `ทั้งหมด ${list.length}`], ['eng', `ENG ${list.filter(r => r.scope === 'eng').length}`], ['gen', `ทั่วไป ${list.filter(r => r.scope !== 'eng').length}`]].map(([k, l]) => `<button type="button" data-rf="${k}" class="${filt === k ? 'on' : ''}">${l}</button>`).join('')}</div>
      <div class="rwgrid">${shown.concat([{ id: null, name: '', description: '', cost: 1, stock: null, sort: 0, active: true, image: null, scope: filt === 'eng' ? 'eng' : 'all' }]).map(card).join('')}</div>
      <div class="hint">ลบของรางวัลไม่ได้ (เพราะมีประวัติการแลก) ให้ปิดสวิตช์ "แสดง" แทน · รูปจะถูกย่อเป็นสี่เหลี่ยมจัตุรัสอัตโนมัติ</div>`;
    el.onclick = async e => {
      const rf = e.target.closest('[data-rf]'); if (rf) { el.dataset.f = rf.dataset.rf; rewardsTab(); return; }
      const pick = e.target.closest('[data-pick]');
      if (pick) { const url = await pickImage(); if (url) { images[pick.dataset.pick] = url; pick.style.backgroundImage = `url('${url}')`; pick.textContent = ''; } return; }
      const b = e.target.closest('button'); if (!b) return;
      const tr = b.closest('[data-kind]'), g = n => tr.querySelector(`[name="${n}"]`);
      try {
        const r = { name: g('name').value.trim(), description: g('description').value.trim() || null, cost: parseInt(g('cost').value, 10), stock: g('stock').value === '' ? null : parseInt(g('stock').value, 10),
          sort: parseInt(g('sort').value || '0', 10), active: g('active').checked, scope: g('scope').value, repeatable: g('repeatable').checked, image: images[tr.dataset.id || 'new'] || null };
        if (!r.name || !(r.cost > 0)) return IMF.toast('กรอกชื่อและ Point ให้ครบ', true);
        if (tr.dataset.id) r.id = Number(tr.dataset.id);
        await api.rewards.save(r);
        IMF.toast('บันทึกแล้ว'); rewardsTab();
      } catch (ex) { IMF.toast(IMF.errMsg(ex), true); }
    };
  }

  async function activitiesTab() {
    const el = $('#t-acts');
    let acts; try { acts = await api.activities.list(true); } catch (e) { return fail(el, e); }
    const card = (a) => `<div class="card rwc" data-id="${a.id || ''}" data-kind="activity">
        <input class="input" name="name" value="${esc(a.name)}" placeholder="${a.id ? 'ชื่อกิจกรรม' : '+ กิจกรรมใหม่ เช่น ถ่ายรูปที่ Photo booth'}" aria-label="ชื่อกิจกรรม">
        <div class="rwb">${ff('ได้ Point', `<input class="input" name="points" type="number" min="1" value="${a.points}" style="width:90px">`)}${swf('รับซ้ำได้', 'repeatable', a.repeatable)}${swf('เปิด', 'active', a.active)}<button class="btn small ${a.id ? '' : 'red'}">${a.id ? 'บันทึก' : 'เพิ่ม'}</button></div></div>`;
    el.innerHTML = `<div class="rwgrid">${acts.concat([{ id: null, name: '', points: 1, active: true }]).map(card).join('')}</div>
      <div class="hint">ทีมงานให้ Point ในหน้าสแกน (โหมดกิจกรรม) · ปิด "รับซ้ำได้" = คนละครั้ง</div>`;
    el.onclick = async e => {
      const b = e.target.closest('button'); if (!b) return;
      const tr = b.closest('[data-kind]'), g = n => tr.querySelector(`[name="${n}"]`);
      try {
        const a = { name: g('name').value.trim(), points: parseInt(g('points').value, 10), active: g('active').checked, repeatable: g('repeatable').checked };
        if (!a.name || !(a.points > 0)) return IMF.toast('กรอกชื่อกิจกรรมและ Point ให้ครบ', true);
        if (tr.dataset.id) a.id = Number(tr.dataset.id);
        await api.activities.save(a);
        IMF.toast('บันทึกแล้ว'); activitiesTab();
      } catch (ex) { IMF.toast(IMF.errMsg(ex), true); }
    };
  }

  // ---------------- team ----------------
  const ROLE = { owner: 'Owner', admin: 'แอดมิน', staff: 'ทีมงาน' };
  async function teamTab() {
    const el = $('#t-team');
    let staff; try { staff = await api.staffList(); } catch (e) { return fail(el, e); }
    const can = (r) => info.is_owner || r === 'staff';   // admins manage staff only; the owner manages everyone
    const rank = { owner: 0, admin: 1, staff: 2 };
    staff.sort((a, b) => rank[a.role] - rank[b.role]);
    el.innerHTML = `<div class="card stack"><h3>${icon('shield', 19)} ทีมงานและสิทธิ์</h3>
        <div class="hint"><b>Owner</b> ทำได้ทุกอย่าง รวมถึงเพิ่ม/ลบ/เปลี่ยนสิทธิ์แอดมินและทีมงานทุกคน · <b>แอดมิน</b> ใช้หลังบ้านได้ทั้งหมด และจัดการได้เฉพาะทีมงาน · <b>ทีมงาน</b> ใช้หน้าสแกนได้อย่างเดียว<br>คนที่จะเพิ่มต้องเข้าสู่ระบบเว็บนี้อย่างน้อย 1 ครั้งก่อน</div>
        <form id="addst" class="row"><input class="input" name="em" type="email" placeholder="อีเมล" style="flex:1" required>
          <select class="input" name="r" style="width:auto"><option value="staff">ทีมงาน</option>${info.is_owner ? '<option value="admin">แอดมิน</option><option value="owner">Owner</option>' : ''}</select><button class="btn small">เพิ่ม / เปลี่ยนสิทธิ์</button></form>
        <ul class="list">${staff.map(s => `<li><div style="flex:1" class="small">${esc(s.email)}</div><span class="chip ${s.role !== 'staff' ? 'on' : ''}">${ROLE[s.role]}</span>
          ${can(s.role) && s.email !== info.email ? `<button class="btn danger small" data-rm="${s.user_id}">ลบสิทธิ์</button>` : '<span style="width:74px"></span>'}</li>`).join('') || '<li class="dim">ยังไม่มี</li>'}</ul></div>`;
    $('#addst').onsubmit = async e => {
      e.preventDefault(); const f = e.target;
      try { await rpc('admin_add_staff', { em: f.em.value.trim(), r: f.r.value }); IMF.toast('บันทึกแล้ว'); teamTab(); } catch (ex) { IMF.toast(IMF.errMsg(ex), true); }
    };
    el.onclick = async e => {
      const b = e.target.closest('[data-rm]'); if (!b || !confirm('ลบสิทธิ์ของคนนี้?')) return;
      try { await rpc('admin_remove_staff', { uid: b.dataset.rm }); teamTab(); } catch (ex) { IMF.toast(IMF.errMsg(ex), true); }
    };
  }

  statusStrip(); overview();
})();
</script>
