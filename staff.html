<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c9363a">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>สแกน QR · INTANIA MUSIC FEST</title>
<link rel="icon" href="assets/icon.png">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/config.js"></script>
<script src="assets/vendor/supabase.js"></script>
<script src="assets/vendor/html5-qrcode.min.js"></script>
<script src="assets/app.js"></script>
</head>
<body>
<main class="stage"><div class="inner" id="root"><div class="spinner" style="margin-top:120px"></div></div></main>

<script>
(async () => {
  const { api, rpc, $, $$, esc, fmt, CATEGORY, YEAR, GENDER } = IMF;
  const root = $('#root');
  const { info, settings } = await IMF.boot();

  if (!info.logged_in) {
    root.innerHTML = `<div class="ph"><h1>สแกน QR</h1></div><div id="login" class="stack"></div>`;
    IMF.loginButtons($('#login')); return;
  }
  if (!info.is_staff) {
    root.innerHTML = `<div class="card" style="margin-top:60px">บัญชี ${esc(info.email)} ยังไม่ได้รับสิทธิ์ทีมงาน ให้แอดมินเพิ่มสิทธิ์ในหน้าหลังบ้าน</div>`; return;
  }

  let activities = [];
  try { activities = await api.activities.list(); } catch (e) {}
  let open = null, busy = false, scanner = null, lastText = '', lastAt = 0;

  root.innerHTML = `<div class="ph"><h1>สแกน QR</h1><span class="staffbadge">STAFF</span></div><div class="stack" style="margin-top:0">
    <div id="reader"></div>
    <button class="btn red block" id="cam">${IMF.icon('scan', 20, 2)}เปิดกล้อง</button>
    <form id="manual" class="row nowrap" autocomplete="off">
      <input class="input" name="q" placeholder="รหัสนิสิต / โค้ด / อีเมล" style="flex:1;min-width:0">
      <button class="btn small">ค้นหา</button>
    </form>
    <div class="card"><div class="card-title"><h3>ล่าสุด</h3><span class="small dim" id="count">0</span></div><ul class="list small" id="log"><li class="dim">ยังไม่มี</li></ul></div>
  </div>`;

  const log = [];
  const now = () => new Date().toLocaleTimeString('th-TH');
  function addLog(t) { log.unshift(t); $('#log').innerHTML = log.slice(0, 15).map(x => `<li>${x}</li>`).join(''); $('#count').textContent = log.length; }
  function beep(ok) {
    try { const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(); o.frequency.value = ok ? 880 : 220; o.connect(c.destination); o.start(); setTimeout(() => { o.stop(); c.close(); }, ok ? 120 : 350); } catch (e) {}
    if (navigator.vibrate) navigator.vibrate(ok ? 60 : [80, 60, 80]);
  }

  const person = (p) => `<div style="font-size:24px;font-weight:800;line-height:1.2">${esc(p.name)}${p.nickname ? ` <span class="dim" style="font-weight:600">(${esc(p.nickname)})</span>` : ''}</div>
    <div class="kv">
      ${p.student_id ? `<div><small>รหัสนิสิต</small><b>${esc(p.student_id)}</b></div><div><small>ชั้นปี</small><b>${p.year ? esc(YEAR[p.year]) : '–'}</b></div><div class="full"><small>คณะ</small><b>${esc(p.faculty || '–')}${p.group_code ? ' · Group ' + esc(p.group_code) : ''}</b></div>`
        : `<div class="full"><small>ประเภท</small><b>${esc(CATEGORY[p.category])}</b></div>`}
      <div><small>Point</small><b>${fmt(p.points)}</b></div><div><small>เข้างาน</small><b>${p.checked_in_at ? '✓ ' + IMF.dateTH(p.checked_in_at) : 'ยังไม่เข้า'}</b></div>
    </div>
    ${p.by_token ? '' : '<div class="chip warn" style="margin-top:10px;color:#9a5b00;border-color:#d98200;background:#fff6e5">ค้นหาด้วยการพิมพ์ ตรวจบัตรก่อน</div>'}`;
  const closeBtn = '<button class="btn ghost block" data-close>ปิด</button>';
  function show(html) {
    if (open) open.close();
    open = IMF.modal(html, { onClose: () => { open = null; lastAt = Date.now(); } });
    return open.el;
  }
  const autoClose = () => { const mine = open; setTimeout(() => { if (open === mine && mine) mine.close(); }, 1800); };

  // every scan / search opens a pop-up; nothing changes until the staff taps a button
  async function handle(text) {
    if (busy || open) return;
    busy = true;
    try {
      const p = await rpc('staff_lookup', { q: text });
      beep(true);
      if (p.kind === 'redeem') popRedeem(p); else popPerson(p);
    } catch (e) {
      beep(false);
      show(`<div class="stack"><div class="status bad">${esc(IMF.errMsg(e))}</div>${closeBtn}</div>`);
    } finally { busy = false; }
  }

  // redeem QR from the person's rewards page
  function popRedeem(p) {
    const q = p.request;
    const bad = q.status === 'done' ? 'QR นี้แลกไปแล้ว' : q.status === 'expired' ? 'QR หมดอายุ' : q.status === 'cancelled' ? 'ผู้ใช้ยกเลิกแล้ว'
      : !settings.redeem_open ? IMF.errMsg('REDEEM_CLOSED') : p.points < q.cost ? 'Point ไม่พอ' : q.stock != null && q.stock <= 0 ? 'ของหมดแล้ว' : null;
    if (bad) beep(false);
    const el = show(`<div class="stack">
      <span class="kindchip">${IMF.icon('gift', 15, 2)}QR แลกของรางวัล</span>
      <div><div style="font-size:24px;font-weight:800">${esc(q.reward)}</div><div class="muted">${fmt(q.cost)} Point${q.stock != null ? ` · เหลือ ${fmt(q.stock)}` : ''}</div></div>
      ${person(p)}
      ${bad ? `<div class="status bad">${esc(bad)}</div>` : `<button class="btn red big block" id="go">${IMF.icon('check', 22, 2.6)}ยืนยันการแลก</button>`}
      ${closeBtn}</div>`);
    if (bad) return;
    $('#go', el).onclick = async (e) => {
      e.currentTarget.disabled = true;
      try {
        const r = await rpc('staff_redeem_confirm', { tok: q.token });
        beep(true); addLog(`🎁 ${esc(p.name)} · ${esc(r.reward)} <span class="dim">${now()}</span>`);
        show(`<div class="stack"><div class="status ok">แลกสำเร็จ<small>${esc(r.reward)} · เหลือ ${fmt(r.points)} Point · ให้ของได้เลย</small></div>${closeBtn}</div>`);
        autoClose();
      } catch (ex) { beep(false); show(`<div class="stack"><div class="status bad">${esc(IMF.errMsg(ex))}</div>${closeBtn}</div>`); }
    };
  }

  // ticket QR or a typed search: check in, and/or give activity points
  function popPerson(p) {
    const actSel = activities.length ? `<div class="stack" style="border-top:1px solid #e6d8d9;padding-top:14px"><b>ให้ Point กิจกรรม</b>
      <div class="row nowrap"><select class="input" id="act" style="flex:1;min-width:0">${activities.map(a => `<option value="${a.id}">${esc(a.name)} (+${a.points})</option>`).join('')}</select>
      <button class="btn small" id="give">ให้ Point</button></div></div>` : '';
    const el = show(`<div class="stack">
      ${p.checked_in_at ? `<div class="status warn">เข้างานแล้ว<small>${IMF.dateTH(p.checked_in_at)}</small></div>` : '<div class="status info">ยังไม่ได้เข้างาน</div>'}
      ${person(p)}
      ${p.checked_in_at ? '' : `<button class="btn red big block" id="go">${IMF.icon('check', 22, 2.6)}ยืนยันเข้างาน</button>`}
      ${actSel}${closeBtn}</div>`);
    if ($('#go', el)) $('#go', el).onclick = async (e) => {
      e.currentTarget.disabled = true;
      try {
        const r = await rpc('staff_checkin', { uid: p.id });
        beep(r.ok); addLog(`${r.ok ? '✅' : '⚠️'} ${esc(p.name)} <span class="dim">${now()}</span>`);
        show(`<div class="stack"><div class="status ${r.ok ? 'ok' : 'warn'}">${r.ok ? 'เข้างานเรียบร้อย' : 'เข้างานแล้ว'}<small>${IMF.dateTH(r.checked_in_at)}</small></div>${person(p)}${closeBtn}</div>`);
        if (r.ok) autoClose();
      } catch (ex) { beep(false); IMF.toast(IMF.errMsg(ex), true); e.currentTarget.disabled = false; }
    };
    if ($('#give', el)) $('#give', el).onclick = async (e) => {
      const a = activities.find(x => x.id == $('#act', el).value);
      e.currentTarget.disabled = true;
      try {
        const r = await rpc('staff_award', { uid: p.id, activity: a.id });
        beep(true); addLog(`⭐ ${esc(p.name)} · ${esc(r.activity)} +${r.added} <span class="dim">${now()}</span>`);
        show(`<div class="stack"><div class="status ok">+${r.added} Point<small>${esc(r.activity)} · รวม ${fmt(r.points)} Point</small></div>${closeBtn}</div>`);
        autoClose();
      } catch (ex) { beep(false); show(`<div class="stack"><div class="status warn">${esc(IMF.errMsg(ex))}</div>${person(p)}${closeBtn}</div>`); }
    };
  }

  $('#manual').onsubmit = e => { e.preventDefault(); const v = e.target.q.value.trim(); if (v) handle(v); };

  $('#cam').onclick = async () => {
    if (scanner) { await scanner.stop().catch(() => {}); scanner.clear(); scanner = null; $('#cam').innerHTML = IMF.icon('scan', 20, 2) + 'เปิดกล้อง'; return; }
    scanner = new Html5Qrcode('reader');
    try {
      await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: (w, h) => { const s = Math.floor(Math.min(w, h) * 0.7); return { width: s, height: s }; } },
        text => {
          const t = Date.now();
          if (open || (text === lastText && t - lastAt < 3000)) return;   // wait until the pop-up is closed
          lastText = text; lastAt = t; handle(text);
        });
      $('#cam').innerHTML = 'ปิดกล้อง';
    } catch (e) { scanner = null; IMF.toast('เปิดกล้องไม่ได้: ' + (e.message || e), true); }
  };
})();
</script>
</body>
</html>
